name: P5 validator v0.2 tests

on:
  pull_request:
    paths:
      - "09_INFRASTRUCTURE_AGENTIQUE/prism/evaluation.py"
      - "09_INFRASTRUCTURE_AGENTIQUE/prism/test_evaluation.py"
      - ".github/workflows/p5-validator.yml"
  push:
    branches:
      - "work/p5-validator-v0-2-tests-2026-11-10"
    paths:
      - "09_INFRASTRUCTURE_AGENTIQUE/prism/evaluation.py"
      - "09_INFRASTRUCTURE_AGENTIQUE/prism/test_evaluation.py"
      - ".github/workflows/p5-validator.yml"

permissions:
  contents: read

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run P5 validator unit tests
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/prism
        run: python -m unittest -v test_evaluation.py
