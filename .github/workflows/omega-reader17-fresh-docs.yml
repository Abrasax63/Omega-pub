name: Omega Reader17 - frozen fresh-document retrieval vs real 3B
on:
  push:
    branches:
      - experiment/omega-reader17-fresh-docs-2026-11-19
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-reader17-fresh-docs
  cancel-in-progress: false

jobs:
  frozen-source-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen source blobs, prompt isolation, gates and strict outputs
        run: |
          cd 09_INFRASTRUCTURE_AGENTIQUE/reader_bridge17
          python -m unittest -v test_experiment.py
      - name: Replay all A/C/D policies with NO neural inference or labels
        run: |
          python 09_INFRASTRUCTURE_AGENTIQUE/reader_bridge17/experiment.py \
            --mode controls --output /tmp/omega-reader17/source-controls.json
      - name: Archive deterministic controls and any failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader17-source-only-controls
          path: /tmp/omega-reader17/
          retention-days: 14
          if-no-files-found: warn

  real-local-3b-selector:
    needs: frozen-source-controls
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore pinned CPU llama.cpp binary/source
        uses: actions/cache@v4
        with:
          path: ~/.cache/omega11/llama.cpp
          key: omega11-llama-server-5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
      - name: Verify pinned source and build llama-server without network fallback to other commits
        shell: bash
        run: |
          set -euo pipefail
          BASE="$HOME/.cache/omega11/llama.cpp"
          mkdir -p "$(dirname "$BASE")"
          if [[ ! -f "$BASE/CMakeLists.txt" ]]; then
            git clone --depth 1 --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$BASE"
            git -C "$BASE" fetch --depth=1 origin 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
            git -C "$BASE" checkout --detach 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
          fi
          test "$(git -C "$BASE" rev-parse HEAD)" = "5a4afd80779ba51166b59986e61a0bfbb9e1a4c6"
          cmake -S "$BASE" -B "$BASE/build" -G Ninja -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$BASE/build" --target llama-server -j 4
      - name: Restore pinned GGUF model
        uses: actions/cache@v4
        with:
          path: ~/.cache/omega11/model.gguf
          key: omega11-qwen2p5-coder3b-724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7
      - name: Download original Qwen Coder 3B weights and verify SHA256
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$HOME/.cache/omega11/model.gguf"
          mkdir -p "$(dirname "$MODEL")"
          if [[ ! -f "$MODEL" ]]; then
            curl -fL --retry 3 --connect-timeout 30 --max-time 750 \
              "https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/qwen2.5-coder-3b-instruct-q4_k_m.gguf" -o "$MODEL"
          fi
          echo "724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7  $MODEL" | sha256sum -c -
      - name: Infer all nonempty policies, preserve unmodified outputs
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.cache/omega11/llama.cpp/build/bin/llama-server" \
            -m "$HOME/.cache/omega11/model.gguf" -c 8192 -t 4 \
            --host 127.0.0.1 --port 8091 > /tmp/omega-reader17-llama.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json,time,urllib.request
          for _ in range(120):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8091/health',timeout=2) as f:
                      ready=json.loads(f.read())
                  if ready.get('status')=='ok':
                      print('LOCAL_3B_READY',flush=True)
                      break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit('READER17_LOCAL_MODEL_INFRA_FAILURE')
          PY
          python 09_INFRASTRUCTURE_AGENTIQUE/reader_bridge17/experiment.py \
            --mode model --output /tmp/omega-reader17/source-and-model.json
          python - <<'PY'
          import json
          with open('/tmp/omega-reader17/source-and-model.json', encoding='utf8') as f:
              d=json.load(f)
          assert d['status']=='FINISHED_REAL_INFERENCE'
          assert len(d['items'])==3 and d['no_gold_available']
          assert d['automatic_certifications']==0 and d['automatic_horn_rules']==0
          assert d['paid_api_calls']==0 and d['model_weight_updates']==0
          for item in d['items']:
              for key, pool in item['pools'].items():
                  m=pool['model']
                  assert m['status'] in ('NO_CANDIDATES','VALID_REPLY','INVALID_REPLY')
                  if m['status']=='VALID_REPLY':
                      assert m['source_citations_admitted']==len(m['selected'])
                  print(item['doc_id'],key,m['status'],
                        'pool=',pool['total_candidate_count'],
                        'chosen=',m['selected'],
                        'tokens=',m.get('tokens'),flush=True)
          PY
      - name: Preserve immutable source/model evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader17-prospective-sources-qwen3b-raw
          path: |
            /tmp/omega-reader17/
            /tmp/omega-reader17-llama.log
          retention-days: 14
          if-no-files-found: warn
