name: FOUNDATIONS01 ARCH LOCAL01 learned local dispatch
on:
  push:
    branches: [experiment/omega-foundations-selfplay-2026-11-24]
    paths: ['.github/workflows/foundations01-arch-local01.yml','research/learning_hub/foundations01/arch_local01.py']
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -u research/learning_hub/foundations01/arch_local01.py train --out /tmp/local01.json
      - uses: actions/upload-artifact@v4
        with:
          name: local01-checkpoint
          path: /tmp/local01.json
  evaluate:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: local01-checkpoint
          path: /tmp/local
      - run: python -u research/learning_hub/foundations01/arch_local01.py evaluate --checkpoint /tmp/local/local01.json --out /tmp/local01-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: local01-results
          path: /tmp/local01-results.json
