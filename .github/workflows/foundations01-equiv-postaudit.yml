name: FOUNDATIONS01 EQUIV post-audit fixture only
on:
  push:
    branches: [experiment/omega-foundations-selfplay-2026-11-24]
    paths: ['.github/workflows/foundations01-equiv-postaudit.yml','research/learning_hub/foundations01/equiv_postaudit01.py']
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install networkx==3.4.2
      - run: python -u research/learning_hub/foundations01/equiv_postaudit01.py --fixture
