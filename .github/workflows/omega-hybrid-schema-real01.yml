name: Omega hybrid schema diagnostic - one shot on workflow creation

# The 3-node REAL-02 example has already been exposed; this run is NOT
# an independent learning test. Use only once for diagnosing missing fields.
# PUSH path filtering avoids expensive replay on unrelated PR synchronizations.
on:
  push:
    branches:
      - experiment/omega-hybrid-learning-gates-2026-11-23
    paths:
      - .github/workflows/omega-hybrid-schema-real01.yml

permissions:
  contents: read

concurrency:
  group: omega-hybrid-schema-real01
  cancel-in-progress: false

jobs:
  prereg-and-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate only the new code and offline contracts
        run: |
          set -euo pipefail
          python -m py_compile 09_INFRASTRUCTURE_AGENTIQUE/prism/omega_hybrid_schema_retry.py
          python -m py_compile 09_INFRASTRUCTURE_AGENTIQUE/prism/omega_hybrid_schema_real01.py
          python -m unittest discover -s 09_INFRASTRUCTURE_AGENTIQUE/prism -p 'test_omega_hybrid_schema*.py' -v
  qwen3b-once:
    needs: prereg-and-offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LLAMA_URL: https://github.com/ggml-org/llama.cpp/releases/download/b12633/llama-b12633-bin-ubuntu-x64.tar.gz
      MODEL_URL: https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/main/Qwen2.5-3B-Instruct-Q4_K_M.gguf
      MODEL_SHA: 9c9f56a391a3abbd5b89d0245bf6106081bcc3173119d4229235dd9d23253f94
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Obtain pinned local CPU model, reject changed weights
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/omega-hybrid" diagnostic-output
          curl -fLsS --retry 2 --retry-all-errors --max-time 300 "$LLAMA_URL" -o "$RUNNER_TEMP/omega-hybrid/llama.tar.gz"
          tar -xzf "$RUNNER_TEMP/omega-hybrid/llama.tar.gz" -C "$RUNNER_TEMP/omega-hybrid"
          BIN="$(find "$RUNNER_TEMP/omega-hybrid" -type f -name llama-server | head -1)"
          test -n "$BIN"
          chmod +x "$BIN"
          echo "LLAMA_SERVER=$BIN" >> "$GITHUB_ENV"
          curl -fLsS --retry 2 --retry-all-errors --max-time 750 "$MODEL_URL" -o "$RUNNER_TEMP/omega-hybrid/model.gguf"
          test "$(head -c 4 "$RUNNER_TEMP/omega-hybrid/model.gguf")" = 'GGUF'
          echo "$MODEL_SHA  $RUNNER_TEMP/omega-hybrid/model.gguf" | sha256sum -c -
          sha256sum "$RUNNER_TEMP/omega-hybrid/model.gguf" > diagnostic-output/model.sha256
          "$BIN" --version > diagnostic-output/llama-version.txt 2>&1 || true
      - name: Start model on CPU only, without external API keys
        run: |
          set -euo pipefail
          LIB="$(dirname "$LLAMA_SERVER")"
          LD_LIBRARY_PATH="$LIB:${LD_LIBRARY_PATH:-}" "$LLAMA_SERVER" \
            -m "$RUNNER_TEMP/omega-hybrid/model.gguf" \
            --host 127.0.0.1 --port 8080 -c 4096 -t 2 -ngl 0 \
            > diagnostic-output/server.log 2>&1 &
          for i in $(seq 1 100); do
            if curl -sf --max-time 3 http://127.0.0.1:8080/health >/dev/null; then
              echo "CPU_LOCAL_MODEL_READY"
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: One diagnostic retry, never a learning certification
        run: |
          set -euo pipefail
          timeout 250 python 09_INFRASTRUCTURE_AGENTIQUE/prism/omega_hybrid_schema_real01.py \
            --server http://127.0.0.1:8080 \
            --output diagnostic-output/result.json \
            2>&1 | tee diagnostic-output/summary.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('diagnostic-output/result.json').read_text())
          assert d['scientific_claims_certified']==0
          assert d['benchmark_of_new_competence'] is False
          assert d['model_weights_updated'] is False
          assert d['model_call_count'] <= 1
          print("DIAGNOSTIC_ONLY_NO_NEW_SKILL_PROVEN")
          PY
      - name: Preserve the exact raw reply and measurement on failure too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-hybrid-schema-real01-once
          path: diagnostic-output/
          retention-days: 7
          if-no-files-found: warn
