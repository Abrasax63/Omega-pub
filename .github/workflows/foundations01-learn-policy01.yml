name: FOUNDATIONS01 LEARN POLICY01 frozen engine
on:
  push:
    branches: [experiment/omega-foundations-selfplay-2026-11-24]
    paths: ['.github/workflows/foundations01-learn-policy01.yml','research/learning_hub/foundations01/learn_policy01.py']
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -u research/learning_hub/foundations01/learn_policy01.py train --out /tmp/learn-policy.json
      - uses: actions/upload-artifact@v4
        with:
          name: learn-policy-checkpoint
          path: /tmp/learn-policy.json
  evaluate:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: learn-policy-checkpoint
          path: /tmp/policy
      - run: python -u research/learning_hub/foundations01/learn_policy01.py evaluate --checkpoint /tmp/policy/learn-policy.json --out /tmp/learn-policy-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: learn-policy-results
          path: /tmp/learn-policy-results.json
