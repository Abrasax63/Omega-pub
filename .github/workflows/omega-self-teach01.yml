name: Omega Self Teach 01 - one-shot blind A/B and blocked C

# Run once when this PR is opened. Replays of consumed sealed tests cannot
# count as new generalization evidence. CPU only, no paid API or write token.
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/omega-self-teach01.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-self-teach01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify pre-registered task partitions, sandbox and guards
        shell: bash
        run: |
          set -euo pipefail
          test -s research/learning_hub/self_teach01/PREREG.md
          python -m unittest discover -s research/learning_hub/self_teach01 \
            -p test_self_teach01.py -v

  cpu-blind-ab:
    needs: offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 39
    env:
      LLAMA_BIN_URL: https://github.com/ggml-org/llama.cpp/releases/download/b12633/llama-b12633-bin-ubuntu-x64.tar.gz
      MODEL_URL: https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/main/Qwen2.5-3B-Instruct-Q4_K_M.gguf
      MODEL_SHA256: 9c9f56a391a3abbd5b89d0245bf6106081bcc3173119d4229235dd9d23253f94
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download existing pinned local model and CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/self-teach/runtime" "$RUNNER_TEMP/self-teach/output"
          curl -fLsS --retry 2 --retry-all-errors --max-time 300 \
            "$LLAMA_BIN_URL" -o "$RUNNER_TEMP/self-teach/runtime/llama.tar.gz"
          tar -xzf "$RUNNER_TEMP/self-teach/runtime/llama.tar.gz" \
            -C "$RUNNER_TEMP/self-teach/runtime"
          BIN="$(find "$RUNNER_TEMP/self-teach/runtime" -type f -name llama-server | head -1)"
          test -n "$BIN"
          chmod +x "$BIN"
          echo "LLAMA_SERVER=$BIN" >> "$GITHUB_ENV"
          curl -fLsS --retry 2 --retry-all-errors --max-time 750 \
            "$MODEL_URL" -o "$RUNNER_TEMP/self-teach/runtime/model.gguf"
          test "$(head -c 4 "$RUNNER_TEMP/self-teach/runtime/model.gguf")" = 'GGUF'
          echo "$MODEL_SHA256  $RUNNER_TEMP/self-teach/runtime/model.gguf" | sha256sum -c -
          sha256sum "$RUNNER_TEMP/self-teach/runtime/model.gguf" \
            > "$RUNNER_TEMP/self-teach/output/model.sha256"
      - name: Start local model on loopback, CPU only
        shell: bash
        run: |
          set -euo pipefail
          LIB="$(dirname "$LLAMA_SERVER")"
          LD_LIBRARY_PATH="$LIB:${LD_LIBRARY_PATH:-}" "$LLAMA_SERVER" \
            -m "$RUNNER_TEMP/self-teach/runtime/model.gguf" \
            --host 127.0.0.1 --port 8080 -c 6144 -t 2 -ngl 0 \
            > "$RUNNER_TEMP/self-teach/output/server.log" 2>&1 &
          for i in $(seq 1 100); do
            if curl --max-time 2 -sf http://127.0.0.1:8080/health > /dev/null; then
              echo "CPU_MODEL_READY"
              exit 0
            fi
            sleep 2
          done
          tail -n 40 "$RUNNER_TEMP/self-teach/output/server.log"
          exit 1
      - name: Generate A and B without opening sealed test
        shell: bash
        run: |
          set -euo pipefail
          timeout 1550 python -u research/learning_hub/self_teach01/pilot.py \
            --server http://127.0.0.1:8080 \
            --output "$RUNNER_TEMP/self-teach/output/raw.json" \
            | tee "$RUNNER_TEMP/self-teach/output/generation.log"
          test -s "$RUNNER_TEMP/self-teach/output/raw.json"
      - name: Open sealed test ONLY after both arms were generated and saved
        shell: bash
        run: |
          set -euo pipefail
          python -u research/learning_hub/self_teach01/score.py \
            --raw "$RUNNER_TEMP/self-teach/output/raw.json" \
            --output "$RUNNER_TEMP/self-teach/output/score.json" \
            | tee "$RUNNER_TEMP/self-teach/output/score.log"
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'self-teach/output/score.json'
          r=json.loads(p.read_text())
          assert r['A']['tests_total']==r['B']['tests_total']==15
          assert r['C']['status']=='TRAINING_NOT_AUTHORIZED'
          assert r['hidden_eval_after_generation_only']
          assert not r['generalization_proven']
          print('BLIND_SCORES_ARCHIVED; NO_AUTONOMOUS_GENERALIZATION_CLAIM')
          PY
      - name: Archive raw runs and provenance, not hidden answers or model weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-self-teach01-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/self-teach/output/raw.json
            ${{ runner.temp }}/self-teach/output/score.json
            ${{ runner.temp }}/self-teach/output/model.sha256
            ${{ runner.temp }}/self-teach/output/generation.log
            ${{ runner.temp }}/self-teach/output/score.log
          retention-days: 7
          if-no-files-found: warn
