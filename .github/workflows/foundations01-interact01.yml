name: FOUNDATIONS01 INTERACT01 black-box intervention
on:
  push:
    branches: [experiment/omega-foundations-selfplay-2026-11-24]
    paths: ['.github/workflows/foundations01-interact01.yml']
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -u research/learning_hub/foundations01/interact01.py /tmp/interact01.json
      - uses: actions/upload-artifact@v4
        with:
          name: interact01-results
          path: /tmp/interact01.json
