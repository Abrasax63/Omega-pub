name: Omega bounded symbolic and Qwen selector (SYMN-01)

on:
  pull_request:
    branches:
      - experiment/omega-targeted-patch-repair-2026-11-15
    paths:
      - '09_INFRASTRUCTURE_AGENTIQUE/symbolic_neural/**'
      - '.github/workflows/omega-symbolic-neural.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-symbolic-neural-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify finite symbolic DSL, exact independent oracle, real RCE and no fake selector
        run: |
          set -euo pipefail
          python -m py_compile 09_INFRASTRUCTURE_AGENTIQUE/symbolic_neural/symbolic_neural.py
          python -m unittest discover -s 09_INFRASTRUCTURE_AGENTIQUE/symbolic_neural -p 'test_symbolic_neural.py' -v
  symbolic-search-plus-qwen-after-smoke:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests without model or remote inference
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/auto_research
        run: |
          python -m py_compile gate.py runner.py model_proposal.py sandbox_runner.py model_pilot.py
          python -m unittest -v test_gate.py test_variant_search.py test_model_proposal.py
      - name: Pull isolated execution image
        run: |
          docker pull python:3.12-slim
          docker image inspect python:3.12-slim --format '{{json .RepoDigests}}'
      - name: Restore pinned llama.cpp build cache
        uses: actions/cache@v4
        id: llama-cache
        with:
          path: ${{ runner.temp }}/llama.cpp
          key: omega-llama-cpu-5a4afd80779ba51166b59986e61a0bfbb9e1a4c6-v1
      - name: Build pinned llama.cpp CPU inference engine
        if: steps.llama-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth=1 origin 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" -G Ninja \
            -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --target llama-cli -j 4
          "$RUNNER_TEMP/llama.cpp/build/bin/llama-cli" --help >/dev/null
      - name: Restore pinned Qwen model weight cache
        uses: actions/cache@v4
        id: model-cache
        with:
          path: ${{ runner.temp }}/model.gguf
          key: omega-qwen2p5-coder-3b-724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7-v1
      - name: Download verified Qwen2.5 Coder 3B Q4_K_M weights
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/model.gguf" ]]; then
            curl -fL --retry 3 --connect-timeout 30 --max-time 750 \
              "https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/qwen2.5-coder-3b-instruct-q4_k_m.gguf" \
              -o "$RUNNER_TEMP/model.gguf"
          fi
          echo "724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7  $RUNNER_TEMP/model.gguf" | sha256sum -c -
      - name: Screen all 16 predicates then have Qwen select among surviving IDs
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/symbolic_neural
        shell: bash
        run: |
          set -euo pipefail
          python symbolic_neural.py \
            --llama-cli "$RUNNER_TEMP/llama.cpp/build/bin/llama-cli" \
            --model-file "$RUNNER_TEMP/model.gguf" \
            --output symbolic-neural-result.json
          python - <<'PY'
          import json
          x = json.load(open('symbolic-neural-result.json', encoding='utf-8'))
          assert x['experiment_id'] == 'OMEGA-SYMNEU-01'
          assert x['provenance']['valid']
          assert x['p3_coverage']['completed'] == 1
          assert x['symbolic_without_rce']['num_hypotheses'] == 16
          assert x['symbolic_with_rce']['num_hypotheses'] == 16
          assert x['symbolic_without_rce']['survivor_ids'] == x['symbolic_with_rce']['survivor_ids']
          assert x['public_cases_count'] == 68
          assert len(x['reserved_manifest']['holdout']) == 5
          assert x['reserved_manifest_sha256']
          assert all(y['development_correct'] for y in x['development'])
          assert x['classics']['square-scan']['correct'] == 5
          assert x['classics']['square-lowbit']['correct'] == 5
          assert x['model_selection']['called']
          assert x['model_selection'].get('returncode') == 0
          assert x['arms']['symbolic_only']['holdout_opened']
          assert not x['promotion_to_core']
          assert not x['comparison']['model_gain_demonstrated']
          print('Qualified candidates:', x['qualified_ids'])
          print('RCE-guided first success rank:',x['symbolic_with_rce']['first_success_rank'])
          print('Unguided first success rank:',x['symbolic_without_rce']['first_success_rank'])
          print('Real Qwen ID selector:',x['model_selection']['status'],x['model_selection'].get('selected_id'))
          print('Arms:',[(k,v['candidate_id'],v.get('correct'),v['decision']) for k,v in x['arms'].items()])
          print('No independent reproduction or scientific promotion asserted.')
          PY
      - name: Save audit data and candidate source (never merge automatically)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-symbolic-neural-result
          path: 09_INFRASTRUCTURE_AGENTIQUE/symbolic_neural/symbolic-neural-result.json
          if-no-files-found: warn
          retention-days: 14
