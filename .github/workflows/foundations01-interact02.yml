name: FOUNDATIONS01 INTERACT02 adaptive hypothesis expansion
on:
  push:
    branches: [experiment/omega-foundations-selfplay-2026-11-24]
    paths: ['.github/workflows/foundations01-interact02.yml','research/learning_hub/foundations01/interact02.py']
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -u research/learning_hub/foundations01/interact02.py /tmp/interact02.json
      - uses: actions/upload-artifact@v4
        with:
          name: interact02-results
          path: /tmp/interact02.json
