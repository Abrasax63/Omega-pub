name: FOUNDATIONS01 EQUIV RUNNER01 fixture only
on:
  push:
    branches: [experiment/omega-foundations-selfplay-2026-11-24]
    paths: ['.github/workflows/foundations01-equiv-runner01.yml','research/learning_hub/foundations01/equiv_runner01.py']
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.49.0 peft==0.15.2 accelerate==1.5.2 huggingface_hub==0.30.2 safetensors==0.5.3 networkx==3.4.2
      - run: |
          python research/learning_hub/foundations01/equiv_process01.py freeze /tmp/frozen
          mkdir /tmp/train /tmp/questions /tmp/labels
          cp /tmp/frozen/{train.json,dev.json,traces.json,process-manifest.json} /tmp/train/
          cp /tmp/frozen/{questions.json,retention-questions.json} /tmp/questions/
          cp /tmp/frozen/{labels.json,retention-labels.json} /tmp/labels/
          python -u research/learning_hub/foundations01/equiv_runner01.py fixture /tmp/train /tmp/questions /tmp/labels /tmp/fixture
      - uses: actions/upload-artifact@v4
        with:
          name: equiv-runner-fixture-result
          path: /tmp/fixture/result.json
