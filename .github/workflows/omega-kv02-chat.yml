name: Omega KV02 - local Qwen chat quality and cache parity
on:
  push:
    branches:
      - experiment/omega-kv-cache-a-b-2026-11-21
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omega-kv02-2026-11-21
  cancel-in-progress: false
jobs:
  kv02-chat-real:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      LLAMA_SHA: 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
      MODEL_SHA: 74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frozen new questions and model controls
        run: |
          python -m unittest discover -s 09_INFRASTRUCTURE_AGENTIQUE/kv_cache01 -p 'test_bench_kv_chat.py' -v
      - uses: actions/cache@v4
        with:
          path: ~/.cache/omega11/llama.cpp
          key: omega11-llama-server-5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/omega-reader18/qwen0p5b.gguf
          key: reader18-qwen0p5b-74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db
      - name: Reuse or build pinned local llama-server
        shell: bash
        run: |
          set -euo pipefail
          BASE="$HOME/.cache/omega11/llama.cpp"
          mkdir -p "$(dirname "$BASE")"
          if [[ ! -f "$BASE/CMakeLists.txt" ]]; then
            git clone --depth 1 --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$BASE"
            git -C "$BASE" fetch --depth=1 origin "$LLAMA_SHA"
            git -C "$BASE" checkout --detach "$LLAMA_SHA"
          fi
          test "$(git -C "$BASE" rev-parse HEAD)" = "$LLAMA_SHA"
          cmake -S "$BASE" -B "$BASE/build" -G Ninja -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$BASE/build" --target llama-server -j 4
      - name: Reuse or download pinned GGUF
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$HOME/.cache/omega-reader18/qwen0p5b.gguf"
          mkdir -p "$(dirname "$MODEL")"
          if [[ ! -f "$MODEL" ]]; then
            curl -fL --retry 3 --connect-timeout 30 --max-time 1500 \
              "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf" -o "$MODEL"
          fi
          echo "$MODEL_SHA  $MODEL" | sha256sum -c -
      - name: Real CPU chat-template KV02 ABBA quality guard
        shell: bash
        run: |
          set -euo pipefail
          python -u 09_INFRASTRUCTURE_AGENTIQUE/kv_cache01/bench_kv_chat.py \
            --server "$HOME/.cache/omega11/llama.cpp/build/bin/llama-server" \
            --model "$HOME/.cache/omega-reader18/qwen0p5b.gguf" \
            --output /tmp/omega-kv02/report.json
      - name: Keep original replies and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-kv02-qwen-chat-real
          path: /tmp/omega-kv02/
          retention-days: 14
          if-no-files-found: warn
