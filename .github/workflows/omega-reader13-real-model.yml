name: Omega Reader13 - real CPU model versus mechanical baseline
on:
  push:
    branches:
      - experiment/omega-reader13-real-small-model-2026-11-18
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-reader13-real-model
  cancel-in-progress: false

jobs:
  source-and-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reader12 regressions plus Reader13 source and baseline tests
        run: |
          cd 09_INFRASTRUCTURE_AGENTIQUE/reader_bridge12
          python -m unittest -v test_bridge.py test_inline_proof_patch.py
          cd ../reader_bridge13
          python -m unittest -v test_experiment.py
      - name: Write reproducible no-model baseline
        run: |
          python 09_INFRASTRUCTURE_AGENTIQUE/reader_bridge13/run_experiment.py --mode baseline --output-dir /tmp/omega-reader13
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-reader13-baseline
          path: /tmp/omega-reader13/
          if-no-files-found: warn
          retention-days: 14

  qwen-cpu-real-inference:
    needs: source-and-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --disable-pip-version-check 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned inference libraries
        run: |
          python -m pip install --disable-pip-version-check 'transformers==4.49.0' 'huggingface-hub==0.29.3'
      - name: REAL no-key model download and deterministic extraction
        run: |
          python 09_INFRASTRUCTURE_AGENTIQUE/reader_bridge13/run_experiment.py --mode model --output-dir /tmp/omega-reader13
      - name: Preserve raw generated text, metrics and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-reader13-real-model-raw
          path: /tmp/omega-reader13/
          if-no-files-found: warn
          retention-days: 14
