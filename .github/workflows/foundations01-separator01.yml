name: FOUNDATIONS01 SEPARATOR01 conditional component factors
on:
  push:
    branches: [experiment/omega-foundations-selfplay-2026-11-24]
    paths: ['.github/workflows/foundations01-separator01.yml','research/learning_hub/foundations01/separator01.py']
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -u research/learning_hub/foundations01/separator01.py /tmp/separator01.json
      - uses: actions/upload-artifact@v4
        with:
          name: separator01-results
          path: /tmp/separator01.json
