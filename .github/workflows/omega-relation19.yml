name: RELATION19 frozen-base instruction switch
on:
  push:
    branches: ['experiment/omega-repr01-cpu-diagnostic-2026-11-25']
    paths: ['.github/workflows/omega-relation19.yml']
permissions:
  contents: read
concurrency:
  group: omega-relation19-single
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline controls and one attempt
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          if git cat-file -e HEAD^:.github/workflows/omega-relation19.yml 2>/dev/null; then exit 1; fi
          python research/learning_hub/primitive_screen01/relation19.py selftest
      - name: Pinned CPU stack
        run: |
          python -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers==4.49.0 safetensors==0.5.3 huggingface_hub==0.30.2 jinja2==3.1.6
      - name: Frozen model inference only
        run: python -u research/learning_hub/primitive_screen01/relation19.py baseline --out /tmp/relation19
      - uses: actions/upload-artifact@v4
        with:
          name: relation19-baseline
          path: /tmp/relation19/*.json
