name: MODULAR04 parallel primitive corrections
on:
  push:
    branches: ['experiment/omega-repr01-cpu-diagnostic-2026-11-25']
    paths: ['.github/workflows/omega-modular04.yml']
permissions:
  contents: read
concurrency:
  group: omega-modular04-single
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify first introduction and offline controls
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          if git cat-file -e HEAD^:.github/workflows/omega-modular04.yml 2>/dev/null; then exit 1; fi
          python research/learning_hub/primitive_screen01/modular04.py selftest
          python research/learning_hub/primitive_screen01/modular04.py freeze --root /tmp/modular-freeze
      - uses: actions/upload-artifact@v4
        with:
          name: modular04-questions
          path: |
            /tmp/modular-freeze/questions.json
            /tmp/modular-freeze/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: modular04-labels
          path: |
            /tmp/modular-freeze/labels.json
            /tmp/modular-freeze/curator.json
            /tmp/modular-freeze/manifest.json
  infer:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: modular04-questions
          path: /tmp/modular-questions
      - name: Install pinned CPU stack
        run: |
          python -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers==4.49.0 safetensors==0.5.3 huggingface_hub==0.30.2
      - name: 512 frozen-model generations on fresh tasks
        run: python -u research/learning_hub/primitive_screen01/modular04.py infer --root /tmp/modular-questions --out /tmp/modular-predictions.jsonl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modular04-predictions
          path: /tmp/modular-predictions.jsonl
          if-no-files-found: warn
  score:
    needs: [freeze,infer]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: modular04-labels
          path: /tmp/modular-labels
      - uses: actions/download-artifact@v4
        with:
          name: modular04-predictions
          path: /tmp/modular-predictions
      - name: Score frozen predictions
        run: python research/learning_hub/primitive_screen01/modular04.py score --root /tmp/modular-labels --pred /tmp/modular-predictions/modular-predictions.jsonl --out /tmp/modular-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: modular04-results
          path: /tmp/modular-result.json
