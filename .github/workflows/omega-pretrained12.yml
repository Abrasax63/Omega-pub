name: PRETRAINED12 pinned Qwen technical smoke
on:
  push:
    branches: ['experiment/omega-repr01-cpu-diagnostic-2026-11-25']
    paths: ['.github/workflows/omega-pretrained12.yml']
permissions:
  contents: read
concurrency:
  group: omega-pretrained12-single
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Single authorized technical attempt
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          if git cat-file -e HEAD^:.github/workflows/omega-pretrained12.yml 2>/dev/null; then exit 1; fi
      - run: |
          python -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers==4.49.0 safetensors==0.5.3 huggingface_hub==0.30.2 peft==0.14.0 jinja2==3.1.6
      - name: Two bounded LoRA updates and restoration checks
        run: python -u research/learning_hub/primitive_screen01/pretrained12.py --out /tmp/pretrained12
      - uses: actions/upload-artifact@v4
        with:
          name: pretrained12-report
          path: /tmp/pretrained12/report.json
