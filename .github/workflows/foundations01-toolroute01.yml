name: FOUNDATIONS01 TOOLROUTE01 end-to-end selection
on:
  push:
    branches: [experiment/omega-foundations-selfplay-2026-11-24]
    paths: ['.github/workflows/foundations01-toolroute01.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -u research/learning_hub/foundations01/toolroute01.py /tmp/toolroute01.json
      - uses: actions/upload-artifact@v4
        with:
          name: toolroute01-results
          path: /tmp/toolroute01.json
