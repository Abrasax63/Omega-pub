name: Omega P5 REAL-03 frozen semantic evaluator and hidden model shifts (CPU)

on:
  pull_request:
    paths:
      - ".github/workflows/omega-p5-real03-frozen-semantic.yml"
      - "09_INFRASTRUCTURE_AGENTIQUE/prism/p5_real03_semantic.py"
      - "09_INFRASTRUCTURE_AGENTIQUE/prism/p5_real03_benchmark.py"
      - "09_INFRASTRUCTURE_AGENTIQUE/prism/test_p5_real03_benchmark.py"
      - "09_INFRASTRUCTURE_AGENTIQUE/EXPERIMENT_P5_REAL03_PREREG_2026-11-12.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real03-models-and-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HOME: /tmp/hf
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      HF_HUB_ETAG_TIMEOUT: "20"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate 80 unique tasks, frozen semantic parser, oracle independence and equal budgets
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/prism
        run: |
          python -m unittest -v test_p5_real03_benchmark
          python p5_real03_benchmark.py --preflight > /tmp/real03_preflight.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/real03_preflight.json"))
          assert x["actual_generations_planned"]==96
          assert x["questions"]==80
          assert x["parser"]=="REAL03-TYPED-PARSER-V1"
          assert x["paid_api_calls"]==0 and not x["private_data_access"]
          print("REAL03_FROZEN_INPUT_DIGEST",x["cases_sha256"])
          PY
      - name: Install open Qwen CPU-only dependencies
        run: |
          python -m pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.51.3" "safetensors>=0.4.5"
      - name: Make 96 genuine model generations, then evaluate nine equal-budget strategies
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/prism
        run: |
          python p5_real03_benchmark.py --output "$RUNNER_TEMP/p5_real03_results.json"
          python - <<'PY'
          import json,os
          from collections import Counter
          x=json.load(open(os.environ["RUNNER_TEMP"]+"/p5_real03_results.json"))
          assert x["status"]=="REAL_OPEN_MODELS_PUBLIC_AUTHOR_DATA_NOT_EXTERNAL_VALIDATION"
          assert x["actual_generations"]==96
          assert len(x["raw_model_outputs"])==96
          assert x["test_decisions"]==64
          assert x["paid_api_calls"]==0 and not x["private_data_used"]
          assert len(x["policy_results"])==9
          assert all(v["verified"]<=24 and len(v["trajectory"])==64
                     for v in x["policy_results"].values())
          assert x["policy_results"]["online_beta"]["trajectory"]==x["policy_results"]["omega_no_alarm"]["trajectory"]
          print("REAL03_COMPLETED_TRUE_MODEL_GENERATIONS",x["primary_omega_minus_discount"])
          PY
      - name: Archive raw public model outputs, frozen parse decisions and all policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-p5-real03-public-${{ github.run_id }}
          path: ${{ runner.temp }}/p5_real03_results.json
          retention-days: 7
          if-no-files-found: ignore
