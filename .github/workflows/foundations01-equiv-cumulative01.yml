name: FOUNDATIONS01 EQUIV CUMULATIVE01 corpus only
on:
  push:
    branches: [experiment/omega-foundations-selfplay-2026-11-24]
    paths: ['.github/workflows/foundations01-equiv-cumulative01.yml','research/learning_hub/foundations01/equiv_cumulative01.py']
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install networkx==3.4.2
      - run: python -u research/learning_hub/foundations01/equiv_cumulative01.py /tmp/cumulative
      - uses: actions/upload-artifact@v4
        with:
          name: cumulative-train-dev
          path: |
            /tmp/cumulative/train.json
            /tmp/cumulative/dev.json
      - uses: actions/upload-artifact@v4
        with:
          name: cumulative-questions
          path: |
            /tmp/cumulative/questions.json
            /tmp/cumulative/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: cumulative-labels
          path: /tmp/cumulative/labels.json
