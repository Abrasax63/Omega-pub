name: FOUNDATIONS01 STRUCTURE01 independent CPU replication
on:
  push:
    branches: [experiment/omega-foundations-selfplay-2026-11-24]
    paths: ['.github/workflows/foundations01-structure01.yml']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          if git cat-file -e HEAD^:.github/workflows/foundations01-structure01.yml 2>/dev/null; then exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: |
          sha256sum research/learning_hub/foundations01/structure01.py
          python -u research/learning_hub/foundations01/structure01.py --out /tmp/structure01
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structure01-replication
          path: /tmp/structure01
          if-no-files-found: warn
