name: LOOP09 budget matching and reversible updates
on:
  push:
    branches: ['experiment/omega-repr01-cpu-diagnostic-2026-11-25']
    paths: ['.github/workflows/omega-loop09.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers==4.49.0 safetensors==0.5.3 huggingface_hub==0.30.2 peft==0.14.0
      - name: Toy rollback and scheduling controls
        run: python research/learning_hub/primitive_screen01/loop09.py selftest
      - name: Pinned Qwen tokenizer only, constrained allocation audit
        run: |
          set -o pipefail
          python research/learning_hub/primitive_screen01/loop09.py preflight | tee /tmp/loop09-budget.json
      - uses: actions/upload-artifact@v4
        with:
          name: loop09-budget
          path: /tmp/loop09-budget.json
