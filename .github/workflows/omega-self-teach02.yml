name: Omega Self Teach 02 - new blind cohort, real free CPU model

# One new preregistered CPU experiment; never run an old cohort as independent.
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/omega-self-teach02.yml"

permissions:
  contents: read

concurrency:
  group: omega-self-teach02-first-run
  cancel-in-progress: false

jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate preregistration, SHA pins, sandbox, tampering and positive/negative controls
        shell: bash
        run: |
          set -euo pipefail
          test -s research/learning_hub/self_teach02/PREREG.md
          python -m unittest discover -s research/learning_hub/self_teach02 \
            -p test_self_teach02.py -v

  real-cpu-new-blind-cohort:
    needs: offline-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LLAMA_BIN_URL: https://github.com/ggml-org/llama.cpp/releases/download/b12633/llama-b12633-bin-ubuntu-x64.tar.gz
      MODEL_URL: https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/main/Qwen2.5-3B-Instruct-Q4_K_M.gguf
      MODEL_SHA256: 9c9f56a391a3abbd5b89d0245bf6106081bcc3173119d4229235dd9d23253f94
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install known CPU runtime and verify pinned free GGUF model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/self-teach02/runtime" "$RUNNER_TEMP/self-teach02/output"
          curl -fLsS --retry 2 --retry-all-errors --max-time 300 \
            "$LLAMA_BIN_URL" -o "$RUNNER_TEMP/self-teach02/runtime/llama.tar.gz"
          tar -xzf "$RUNNER_TEMP/self-teach02/runtime/llama.tar.gz" \
            -C "$RUNNER_TEMP/self-teach02/runtime"
          BIN="$(find "$RUNNER_TEMP/self-teach02/runtime" -type f -name llama-server | head -1)"
          test -n "$BIN"
          chmod +x "$BIN"
          echo "LLAMA_SERVER=$BIN" >> "$GITHUB_ENV"
          curl -fLsS --retry 2 --retry-all-errors --max-time 750 \
            "$MODEL_URL" -o "$RUNNER_TEMP/self-teach02/runtime/model.gguf"
          test "$(head -c 4 "$RUNNER_TEMP/self-teach02/runtime/model.gguf")" = 'GGUF'
          echo "$MODEL_SHA256  $RUNNER_TEMP/self-teach02/runtime/model.gguf" | sha256sum -c -
          sha256sum "$RUNNER_TEMP/self-teach02/runtime/model.gguf" \
            > "$RUNNER_TEMP/self-teach02/output/model.sha256"
      - name: Start read-only llama.cpp model server on localhost
        shell: bash
        run: |
          set -euo pipefail
          LIB="$(dirname "$LLAMA_SERVER")"
          LD_LIBRARY_PATH="$LIB:${LD_LIBRARY_PATH:-}" "$LLAMA_SERVER" \
            -m "$RUNNER_TEMP/self-teach02/runtime/model.gguf" \
            --host 127.0.0.1 --port 8080 -c 6144 -t 2 -ngl 0 \
            > "$RUNNER_TEMP/self-teach02/output/server.log" 2>&1 &
          for i in $(seq 1 100); do
            if curl --max-time 2 -sf http://127.0.0.1:8080/health > /dev/null; then
              echo "CPU_MODEL_READY"
              exit 0
            fi
            sleep 2
          done
          tail -n 40 "$RUNNER_TEMP/self-teach02/output/server.log"
          exit 1
      - name: Generate A and P and B without EVER loading the sealed holdout
        shell: bash
        run: |
          set -euo pipefail
          timeout 1650 python -u research/learning_hub/self_teach02/runner.py \
            --server http://127.0.0.1:8080 \
            --output "$RUNNER_TEMP/self-teach02/output/raw.json" \
            | tee "$RUNNER_TEMP/self-teach02/output/generation.log"
          test -s "$RUNNER_TEMP/self-teach02/output/raw.json"
      - name: Only now open the NEW 18-case sealed cohort and archive the original score
        shell: bash
        run: |
          set -euo pipefail
          python -u research/learning_hub/self_teach02/score.py \
            --raw "$RUNNER_TEMP/self-teach02/output/raw.json" \
            --output "$RUNNER_TEMP/self-teach02/output/score.json" \
            | tee "$RUNNER_TEMP/self-teach02/output/score.log"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'self-teach02/output/score.json'
          x=json.loads(p.read_text())
          assert x['A']['total']==x['P']['total']==x['B']['total']==18
          assert x['C']['status']=='TRAINING_NOT_AUTHORIZED'
          assert x['new_fresh_holdout_now_consumed']
          assert not x['causal_generalization_proven']
          print('OMEGA02_NEW_HOLDOUT_CONSUMED',x['status'])
          PY
      - name: Retain original prompts, model generations and measured score for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-self-teach02-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/self-teach02/output/raw.json
            ${{ runner.temp }}/self-teach02/output/score.json
            ${{ runner.temp }}/self-teach02/output/model.sha256
            ${{ runner.temp }}/self-teach02/output/generation.log
            ${{ runner.temp }}/self-teach02/output/score.log
          retention-days: 14
          if-no-files-found: warn
