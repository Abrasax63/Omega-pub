name: Omega REAL-03 - one-shot exact counterexample repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/omega-repair-real03.yml"

permissions:
  contents: read

concurrency:
  group: omega-repair-real03
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preregistration and offline oracle, model-mock and parser tests
        shell: bash
        run: |
          set -euo pipefail
          test -s 09_INFRASTRUCTURE_AGENTIQUE/prism/OMEGA_REPAIR_REAL03_PREREG_2026-11-23.md
          python -m py_compile 09_INFRASTRUCTURE_AGENTIQUE/prism/omega_repair_real03.py
          python -m unittest discover -s 09_INFRASTRUCTURE_AGENTIQUE/prism -p 'test_omega_repair_real03.py' -v
          python -m unittest discover -s 09_INFRASTRUCTURE_AGENTIQUE/prism -p 'test_concept_abstraction_lab.py' -v

  one-shot-real-model:
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SRC_URL: https://raw.githubusercontent.com/oscarlevin/discrete-book/1a2005c6797bec10289f09e706f81c6c4b809a52/source/sec_gt-relations.ptx
      SRC_BLOB: 75bebda318694bb4712d60380b0e183e77f1e757
      LLAMA_URL: https://github.com/ggml-org/llama.cpp/releases/download/b12633/llama-b12633-bin-ubuntu-x64.tar.gz
      MODEL_URL: https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/main/Qwen2.5-3B-Instruct-Q4_K_M.gguf
      MODEL_SHA: 9c9f56a391a3abbd5b89d0245bf6106081bcc3173119d4229235dd9d23253f94
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify pinned mathematical source (not held-out examples)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p real03_out "$RUNNER_TEMP/real03"
          curl -fLsS --retry 2 --retry-all-errors --max-time 240 "$SRC_URL" -o "$RUNNER_TEMP/real03/relations.ptx"
          test "$(git hash-object "$RUNNER_TEMP/real03/relations.ptx")" = "$SRC_BLOB"
          grep -q 'partial order' "$RUNNER_TEMP/real03/relations.ptx"
          grep -q 'symmetric' "$RUNNER_TEMP/real03/relations.ptx"
          sha256sum "$RUNNER_TEMP/real03/relations.ptx" | tee real03_out/source.sha256
      - name: Obtain SHA-checked 3B GGUF and pinned CPU engine
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --retry-all-errors --max-time 300 "$LLAMA_URL" -o "$RUNNER_TEMP/real03/llama.tar.gz"
          tar -xzf "$RUNNER_TEMP/real03/llama.tar.gz" -C "$RUNNER_TEMP/real03"
          BIN="$(find "$RUNNER_TEMP/real03" -type f -name llama-server | head -1)"
          test -n "$BIN"
          chmod +x "$BIN"
          echo "LLAMA_SERVER=$BIN" >> "$GITHUB_ENV"
          # The two earlier raw curl attempts were cancelled/truncated by the CDN.
          # hf_xet transfers large Hub objects through chunked CAS reconstruction.
          python -m pip install --disable-pip-version-check -q "huggingface_hub>=0.36,<2" "hf_xet>=1.3"
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          directory = Path(os.environ["RUNNER_TEMP"]) / "real03"
          model = hf_hub_download(
              repo_id="bartowski/Qwen2.5-3B-Instruct-GGUF",
              filename="Qwen2.5-3B-Instruct-Q4_K_M.gguf",
              local_dir=str(directory),
              token=False,
          )
          Path(model).replace(directory / "model.gguf")
          print("MODEL_XET_DOWNLOADED_SHA_CHECK_NEXT")
          PY
          test "$(head -c 4 "$RUNNER_TEMP/real03/model.gguf")" = 'GGUF'
          echo "$MODEL_SHA  $RUNNER_TEMP/real03/model.gguf" | sha256sum -c -
          sha256sum "$RUNNER_TEMP/real03/model.gguf" | tee real03_out/model.sha256
          "$BIN" --version > real03_out/llama-version.txt 2>&1 || true
      - name: Start one local 3B model (CPU, no paid API)
        shell: bash
        run: |
          set -euo pipefail
          LIB="$(dirname "$LLAMA_SERVER")"
          LD_LIBRARY_PATH="$LIB" "$LLAMA_SERVER" \
            -m "$RUNNER_TEMP/real03/model.gguf" \
            --host 127.0.0.1 --port 8080 -c 6144 -t 2 -ngl 0 \
            > real03_out/server.log 2>&1 &
          for i in $(seq 1 100); do
            if curl -sf --max-time 3 http://127.0.0.1:8080/health >/dev/null; then
              echo LOCAL_CPU_MODEL_READY
              exit 0
            fi
            sleep 2
          done
          tail -n 50 real03_out/server.log
          exit 1
      - name: Frozen four tasks, paired witness vs masked feedback, no retries
        shell: bash
        run: |
          set -euo pipefail
          timeout 1250 python 09_INFRASTRUCTURE_AGENTIQUE/prism/omega_repair_real03.py \
            --output real03_out --server http://127.0.0.1:8080 \
            2>&1 | tee real03_out/run.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('real03_out/report.json').read_text())
          assert r['api_paid_calls']==0 and r['model_weights_updated'] is False
          assert r['theorems_certified']==0 and r['model_calls']<=12
          assert len(r['tasks'])==4
          assert r['experiment_status'] in (
              'INDETERMINATE_INSUFFICIENT_COMPARABLE_ERRORS',
              'POINTWISE_WITNESS_GAIN', 'PRE_REGISTERED_GAIN_NOT_OBSERVED')
          print("REGISTERED_VERDICT",r['experiment_status'],r.get('counts'))
          PY
      - name: Retain exact prompts, raw answers, oracle and resource metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-repair-real03-one-shot
          path: |
            real03_out/*.json
            real03_out/*.log
            real03_out/*.sha256
            real03_out/*.txt
          retention-days: 7
          if-no-files-found: warn
