name: RESUME25 exact private checkpoint continuation test
on:
  push:
    branches: ['experiment/omega-repr01-cpu-diagnostic-2026-11-25']
    paths: ['.github/workflows/omega-resume25.yml']
permissions:
  contents: read
concurrency:
  group: omega-resume25-offline
  cancel-in-progress: false
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One bounded technical test
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          if git cat-file -e HEAD^:.github/workflows/omega-resume25.yml 2>/dev/null; then exit 1; fi
      - name: CPU toy dependencies only
        run: |
          python -m pip install --quiet numpy==1.26.4
          python -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Save reload and compare the next real toy update
        run: python research/learning_hub/primitive_screen01/resume25.py
