name: Omega elementary copy supervised LoRA
on:
  push:
    branches: [experiment/omega-mask-equality-diagnostic-2026-11-25]
    paths: ['.github/workflows/omega-copy-sft01.yml']
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check quotas, disjointness and exact scoring
        run: python research/learning_hub/mask_equality_diagnostic/copy_sft01.py check
      - name: Freeze corpus
        run: python research/learning_hub/mask_equality_diagnostic/copy_sft01.py freeze --out frozen
      - uses: actions/upload-artifact@v4
        with:
          name: copy-sft01-train-frozen
          path: frozen/train/
      - uses: actions/upload-artifact@v4
        with:
          name: copy-sft01-test-frozen
          path: frozen/test/
  train:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: copy-sft01-train-frozen
          path: frozen-train
      - name: Install CPU training dependencies
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.49.0 huggingface_hub==0.30.2 safetensors==0.5.3 peft==0.14.0 accelerate==1.3.0
      - name: Train only a reversible LoRA adapter
        run: python -u research/learning_hub/mask_equality_diagnostic/copy_sft01.py train --data frozen-train/data.json --sha "$(cat frozen-train/sha256.txt)" --out trained
      - uses: actions/upload-artifact@v4
        with:
          name: copy-sft01-adapter
          path: trained/
  evaluate:
    needs: [freeze, train]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: copy-sft01-test-frozen
          path: frozen-test
      - uses: actions/download-artifact@v4
        with:
          name: copy-sft01-adapter
          path: trained
      - name: Install pinned CPU inference dependencies
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.49.0 huggingface_hub==0.30.2 safetensors==0.5.3 peft==0.14.0 accelerate==1.3.0
      - name: Compare base and adapter on frozen unseen test only
        run: python -u research/learning_hub/mask_equality_diagnostic/copy_sft01.py eval --data frozen-test/data.json --sha "$(cat frozen-test/sha256.txt)" --adapter trained --out evaluated
      - uses: actions/upload-artifact@v4
        with:
          name: copy-sft01-evaluation
          path: evaluated/
