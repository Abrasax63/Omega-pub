name: FOUNDATIONS01 COMPOSE LEARN01 reusable operator synthesis
on:
  push:
    branches: [experiment/omega-foundations-selfplay-2026-11-24]
    paths: ['.github/workflows/foundations01-compose-learn01.yml','research/learning_hub/foundations01/compose_learn01.py']
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -u research/learning_hub/foundations01/compose_learn01.py train --out /tmp/compose01.json
      - uses: actions/upload-artifact@v4
        with:
          name: compose01-checkpoint
          path: /tmp/compose01.json
  evaluate:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: compose01-checkpoint
          path: /tmp/compose
      - run: python -u research/learning_hub/foundations01/compose_learn01.py evaluate --checkpoint /tmp/compose/compose01.json --out /tmp/compose01-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: compose01-results
          path: /tmp/compose01-results.json
