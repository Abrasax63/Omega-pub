name: CONTRACT32 no-training output contract diagnostic
on:
  push:
    branches: ['experiment/omega-repr01-cpu-diagnostic-2026-11-25']
    paths: ['.github/workflows/omega-contract32.yml']
permissions:
  contents: read
concurrency:
  group: omega-contract32-single
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OMEGA_CHECKPOINT_ROOT: /tmp/contract32
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One bounded launch
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          if git cat-file -e HEAD^:.github/workflows/omega-contract32.yml 2>/dev/null; then exit 1; fi
      - name: Fixed CPU stack
        run: |
          python -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          echo 'torch==2.5.1+cpu' > /tmp/contract32-constraints.txt
          python -m pip install --quiet --constraint /tmp/contract32-constraints.txt transformers==4.49.0 safetensors==0.5.3 huggingface_hub==0.30.2 peft==0.14.0 accelerate==1.3.0 jinja2==3.1.6 numpy==1.26.4
          python -c "import torch; assert torch.__version__ == '2.5.1+cpu' and torch.version.cuda is None"
      - name: Twenty-four deterministic responses and zero weight updates
        run: python -u research/learning_hub/primitive_screen01/contract32.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract32-reports
          path: /tmp/contract32/*.json
          if-no-files-found: warn
