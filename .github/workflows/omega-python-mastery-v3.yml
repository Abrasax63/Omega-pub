name: Omega Python mastery 03 - progressive repair and best-state safeguard

# Run only when opening this preregistered workflow in a PR.
# First attempt stopped at preflight, before any model call; this revision
# corrects only a mistaken distinguishing test, without changing tasks.
# Do not replay inspected hidden tests and present as independent.
on:
  pull_request:
    paths:
      - ".github/workflows/omega-python-mastery-v3.yml"

permissions:
  contents: read

concurrency:
  group: omega-python-mastery-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preregistration and offline Python sandbox/black-box checks
        shell: bash
        run: |
          set -euo pipefail
          test -s research/learning_lab/OMEGA_PY_MASTERY_03_PREREG_2026-11-22.md
          python -m unittest discover -s research/learning_lab \
            -p test_prog_reconstruction_pilot.py -v
          python -m unittest discover -s research/learning_lab \
            -p test_python_curriculum_v2.py -v
          python -m unittest discover -s research/learning_lab \
            -p test_python_mastery_v3.py -v

  cpu-learning-experiment:
    # Dataset frozen and already evaluated on SHA 436df0d8. No more inference.
    # GitHub PR path filters may match the cumulative PR diff on later commits.
    if: ${{ github.event.pull_request.head.sha == '436df0d8f542c080cc84443e2971b96fecc41c86' }}
    needs: static-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 34
    env:
      LLAMA_BIN_URL: https://github.com/ggml-org/llama.cpp/releases/download/b12633/llama-b12633-bin-ubuntu-x64.tar.gz
      MODEL_URL: https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/main/Qwen2.5-3B-Instruct-Q4_K_M.gguf
      MODEL_SHA256: 9c9f56a391a3abbd5b89d0245bf6106081bcc3173119d4229235dd9d23253f94
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download previously audited model and free CPU inference engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prog-learn/runtime" "$RUNNER_TEMP/prog-learn/output"
          curl -fLsS --retry 2 --retry-all-errors --max-time 300 \
            "$LLAMA_BIN_URL" -o "$RUNNER_TEMP/prog-learn/runtime/llama.tar.gz"
          tar -xzf "$RUNNER_TEMP/prog-learn/runtime/llama.tar.gz" \
            -C "$RUNNER_TEMP/prog-learn/runtime"
          BIN="$(find "$RUNNER_TEMP/prog-learn/runtime" \
            -type f -name llama-server | head -1)"
          test -n "$BIN"
          chmod +x "$BIN"
          echo "LLAMA_SERVER=$BIN" >> "$GITHUB_ENV"
          curl -fLsS --retry 2 --retry-all-errors --max-time 750 \
            "$MODEL_URL" -o "$RUNNER_TEMP/prog-learn/runtime/model.gguf"
          test "$(head -c 4 "$RUNNER_TEMP/prog-learn/runtime/model.gguf")" = 'GGUF'
          echo "$MODEL_SHA256  $RUNNER_TEMP/prog-learn/runtime/model.gguf" | sha256sum -c -
          sha256sum "$RUNNER_TEMP/prog-learn/runtime/model.gguf" \
            > "$RUNNER_TEMP/prog-learn/output/model.sha256"

      - name: Start local CPU 3B server on loopback only
        shell: bash
        run: |
          set -euo pipefail
          LIB="$(dirname "$LLAMA_SERVER")"
          LD_LIBRARY_PATH="$LIB:${LD_LIBRARY_PATH:-}" "$LLAMA_SERVER" \
            -m "$RUNNER_TEMP/prog-learn/runtime/model.gguf" \
            --host 127.0.0.1 --port 8080 -c 6144 -t 2 -ngl 0 \
            > "$RUNNER_TEMP/prog-learn/output/server.log" 2>&1 &
          for i in $(seq 1 100); do
            if curl --max-time 2 -sf http://127.0.0.1:8080/health > /dev/null; then
              echo "CPU_MODEL_READY"
              exit 0
            fi
            sleep 2
          done
          tail -n 40 "$RUNNER_TEMP/prog-learn/output/server.log"
          exit 1

      - name: Python mastery course - new tasks E F and conditional transfer
        shell: bash
        run: |
          set -euo pipefail
          timeout 1500 python -u research/learning_lab/python_mastery_v3.py \
            --server http://127.0.0.1:8080 \
            --output "$RUNNER_TEMP/prog-learn/output" \
            2>&1 | tee "$RUNNER_TEMP/prog-learn/output/summary.log"
          python - <<'PY'
          import json,os,pathlib
          f=pathlib.Path(os.environ['RUNNER_TEMP'])/'prog-learn/output/report.json'
          report=json.loads(f.read_text())
          assert report['status'] in ('BLOCKED_BELOW_PYTHON_MASTERY_THRESHOLD', 'COMPLETED_NO_CAUSAL_LEARNING_CLAIM')
          assert not report['model_weights_updated']
          assert not report['model_weights_updated']
          assert not report['main_modified']
          assert len(report['syntax_practice'])==3
          assert not report['comparison'].get('no_transfer_claim', False) is False
          assert len(report['model_calls']) in (9,16)
          print('RAW_RESULTS_ARCHIVED; NO_LEARNING_OF_WEIGHTS_CLAIM')
          PY

      - name: Archive raw output and exact provenance, never model weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-python-mastery-v3-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/prog-learn/output/report.json
            ${{ runner.temp }}/prog-learn/output/model.sha256
            ${{ runner.temp }}/prog-learn/output/summary.log
          retention-days: 7
          if-no-files-found: warn
