name: CONTINUITY28 bounded actual Qwen checkpoint check
on:
  push:
    branches: ['experiment/omega-repr01-cpu-diagnostic-2026-11-25']
    paths: ['.github/workflows/omega-continuity28.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: omega-continuity28-single
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMEGA_CHECKPOINT_ROOT: /tmp/continuity28
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One bounded diagnostic only
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          if git cat-file -e HEAD^:.github/workflows/omega-continuity28.yml 2>/dev/null; then exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          name: realbudget10-results
          run-id: 45660422812
          github-token: ${{ github.token }}
          path: /tmp/continuity28/budget
      - uses: actions/download-artifact@v4
        with:
          name: pilot14-adaptive
          run-id: 45662119374
          github-token: ${{ github.token }}
          path: /tmp/continuity28/original
      - uses: actions/download-artifact@v4
        with:
          name: pilot14-results
          run-id: 45662119374
          github-token: ${{ github.token }}
          path: /tmp/continuity28/results
      - name: Fixed CPU stack
        run: |
          python -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          echo 'torch==2.5.1+cpu' > /tmp/continuity28-constraints.txt
          python -m pip install --quiet --constraint /tmp/continuity28-constraints.txt transformers==4.49.0 safetensors==0.5.3 huggingface_hub==0.30.2 peft==0.14.0 accelerate==1.3.0 jinja2==3.1.6 numpy==1.26.4
          python -c "import torch; assert torch.__version__ == '2.5.1+cpu' and torch.version.cuda is None"
      - name: One warm update and one temporary reference update
        run: python -u research/learning_hub/primitive_screen01/continuity28.py reference
      - name: Same next update after a new process
        run: python -u research/learning_hub/primitive_screen01/continuity28.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuity28-report
          path: /tmp/continuity28/continuity28.json
          if-no-files-found: warn
