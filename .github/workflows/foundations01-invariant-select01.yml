name: FOUNDATIONS01 INVARIANT SELECT01 exact benchmark
on:
  push:
    branches: [experiment/omega-foundations-selfplay-2026-11-24]
    paths: ['.github/workflows/foundations01-invariant-select01.yml']
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -u research/learning_hub/foundations01/invariant_select01.py /tmp/invariant-select01.json
      - uses: actions/upload-artifact@v4
        with:
          name: invariant-select01-results
          path: /tmp/invariant-select01.json
