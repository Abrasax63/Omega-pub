name: MICROLEARN31 bounded feedback learning loop
on:
  push:
    branches: ['experiment/omega-repr01-cpu-diagnostic-2026-11-25']
    paths: ['.github/workflows/omega-microlearn31.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: omega-microlearn31-single
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMEGA_CHECKPOINT_ROOT: /tmp/microlearn31
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One bounded diagnostic only
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          if git show HEAD^:.github/workflows/omega-microlearn31.yml 2>/dev/null | rg -Fq "MICROLEARN31_FIX_INPUT_ROOT_V1"; then exit 1; fi
      - name: Fixed CPU stack
        run: |
          python -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          echo 'torch==2.5.1+cpu' > /tmp/microlearn31-constraints.txt
          python -m pip install --quiet --constraint /tmp/microlearn31-constraints.txt transformers==4.49.0 safetensors==0.5.3 huggingface_hub==0.30.2 peft==0.14.0 accelerate==1.3.0 jinja2==3.1.6 numpy==1.26.4 cryptography==44.0.1
          python -c "import torch; assert torch.__version__ == '2.5.1+cpu' and torch.version.cuda is None"
      - name: Frozen scoring and rollback controls
        run: python research/learning_hub/primitive_screen01/microlearn31.py selftest
      - name: Bounded feedback loop with matched control
        run: python -u research/learning_hub/primitive_screen01/microlearn31.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microlearn31-reports
          path: /tmp/microlearn31/reports/*.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microlearn31-checkpoint-encrypted
          path: /tmp/microlearn31/encrypted/*
          if-no-files-found: warn
