name: Omega ATOM-08 - one-shot atomic reading and logic

# Triggers only when this exact workflow is created. No cron, PR, dispatch
# or repeated holdout use. Model weights remain frozen.
on:
  push:
    branches:
      - experiment/omega-hybrid-learning-gates-2026-11-23
    paths:
      - .github/workflows/omega-hybrid-atom08-once.yml

permissions:
  contents: read

concurrency:
  group: omega-hybrid-atom08-one-shot
  cancel-in-progress: false

jobs:
  prereg-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gate source syntax, truth table and immutable inputs before inference
        shell: bash
        run: |
          set -euo pipefail
          test -s 09_INFRASTRUCTURE_AGENTIQUE/prism/OMEGA_HYBRID_ATOM08_PREREG_2026-11-24.md
          python -m py_compile 09_INFRASTRUCTURE_AGENTIQUE/prism/omega_hybrid_atom08.py
          python -m unittest discover -s 09_INFRASTRUCTURE_AGENTIQUE/prism -p 'test_omega_hybrid_atom08.py' -v
          PYTHONPATH=09_INFRASTRUCTURE_AGENTIQUE/prism python - <<'PY'
          from omega_hybrid_atom08 import make_manifest,h,canonical
          q,a=make_manifest()
          assert len(q['graphs'])==12 and len(q['truth_table_queries'])==8
          assert len(a['graph_answers'])==12 and len(a['truth_table_answers'])==8
          print('PRE_REGISTERED_QUESTION_SHA256',h(canonical(q)))
          print('PRE_REGISTERED_ORACLE_SHA256',h(canonical(a)))
          print('NO_MODEL_INFERENCE_IN_THIS_JOB')
          PY

  frozen-qwen3b-once:
    needs: prereg-offline
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LLAMA_URL: https://github.com/ggml-org/llama.cpp/releases/download/b12633/llama-b12633-bin-ubuntu-x64.tar.gz
      MODEL_URL: https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/main/Qwen2.5-3B-Instruct-Q4_K_M.gguf
      MODEL_SHA: 9c9f56a391a3abbd5b89d0245bf6106081bcc3173119d4229235dd9d23253f94
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download pinned public model and CPU inference runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p atom08_out "$RUNNER_TEMP/atom08"
          curl -fLsS --retry 2 --retry-all-errors --max-time 300 "$LLAMA_URL" -o "$RUNNER_TEMP/atom08/llama.tar.gz"
          tar -xzf "$RUNNER_TEMP/atom08/llama.tar.gz" -C "$RUNNER_TEMP/atom08"
          BIN="$(find "$RUNNER_TEMP/atom08" -type f -name llama-server | head -1)"
          test -n "$BIN"
          chmod +x "$BIN"
          echo "LLAMA_SERVER=$BIN" >> "$GITHUB_ENV"
          curl -fLsS --retry 2 --retry-all-errors --max-time 750 "$MODEL_URL" -o "$RUNNER_TEMP/atom08/model.gguf"
          test "$(head -c 4 "$RUNNER_TEMP/atom08/model.gguf")" = "GGUF"
          echo "$MODEL_SHA  $RUNNER_TEMP/atom08/model.gguf" | sha256sum -c -
          sha256sum "$RUNNER_TEMP/atom08/model.gguf" > atom08_out/model.sha256
          "$BIN" --version > atom08_out/llama-version.txt 2>&1 || true
      - name: Start local Qwen CPU without paid model API
        shell: bash
        run: |
          set -euo pipefail
          LIB="$(dirname "$LLAMA_SERVER")"
          LD_LIBRARY_PATH="$LIB" "$LLAMA_SERVER" \
            -m "$RUNNER_TEMP/atom08/model.gguf" \
            --host 127.0.0.1 --port 8080 -c 4096 -t 2 -ngl 0 \
            > atom08_out/server.log 2>&1 &
          for i in $(seq 1 100); do
            if curl -sf --max-time 3 http://127.0.0.1:8080/health >/dev/null; then
              echo LOCAL_MODEL_READY
              exit 0
            fi
            sleep 2
          done
          tail -n 50 atom08_out/server.log
          exit 1
      - name: Execute frozen ATOM-08 - 24 reading trials and 8 logic trials
        shell: bash
        run: |
          set -euo pipefail
          timeout 1100 python 09_INFRASTRUCTURE_AGENTIQUE/prism/omega_hybrid_atom08.py \
            --output atom08_out --server http://127.0.0.1:8080 \
            2>&1 | tee atom08_out/summary.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('atom08_out/report.json').read_text())
          assert r['calls']==32
          assert r['model_weights_updated'] is False
          assert r['paid_model_calls']==0 and r['new_competences_certified']==0
          assert r['status'] in (
            'FOUNDATIONAL_GATES_PASS_DESCRIPTIVE_ONLY',
            'FOUNDATIONAL_GATE_NOT_PASSED')
          print('REGISTERED_ATOMIC_DIAGNOSTIC',r['status'])
          print('NO_PARAMETRIC_LEARNING_AND_NO_NEW_SKILL_CLAIMED')
          PY
      - name: Preserve raw model outputs, split oracle, tokens and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-atom08-one-shot
          path: atom08_out/
          retention-days: 7
          if-no-files-found: warn
