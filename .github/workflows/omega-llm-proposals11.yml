name: Omega 11 - local Qwen free hypotheses and durable event ledger

on:
  pull_request:
    branches:
      - experiment/omega-exploration-ledger10-2026-11-17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests for memory and hypothesis integrity
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/llm_proposals11
        run: |
          set -euo pipefail
          python3 -m py_compile proposer.py ledger.py countermodel_review.py test_proposer.py test_countermodel_review.py
          python3 -m unittest -v test_proposer.py test_countermodel_review.py

  local-model-proposals:
    needs: offline-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore pinned llama.cpp source/build cache
        uses: actions/cache@v4
        id: llama-cache
        with:
          path: ~/.cache/omega11/llama.cpp
          key: omega11-llama-server-5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
      - name: Build local llama-server from pinned source
        shell: bash
        run: |
          set -euo pipefail
          BASE="$HOME/.cache/omega11/llama.cpp"
          mkdir -p "$(dirname "$BASE")"
          if [[ ! -f "$BASE/CMakeLists.txt" ]]; then
            git clone --depth 1 --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$BASE"
            git -C "$BASE" fetch --depth=1 origin 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
            git -C "$BASE" checkout --detach 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
          fi
          test "$(git -C "$BASE" rev-parse HEAD)" = "5a4afd80779ba51166b59986e61a0bfbb9e1a4c6"
          if [[ ! -d "$BASE/build" ]]; then
            cmake -S "$BASE" -B "$BASE/build" -G Ninja \
              -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF \
              -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build "$BASE/build" --target llama-server -j 4
          test -x "$BASE/build/bin/llama-server"
      - name: Restore pinned Qwen 2.5 Coder 3B GGUF
        uses: actions/cache@v4
        id: model-cache
        with:
          path: ~/.cache/omega11/model.gguf
          key: omega11-qwen2p5-coder3b-724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7
      - name: Fetch public model if absent and verify weights
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$HOME/.cache/omega11/model.gguf"
          mkdir -p "$(dirname "$MODEL")"
          if [[ ! -f "$MODEL" ]]; then
            curl -fL --retry 3 --connect-timeout 30 --max-time 750 \
              "https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/qwen2.5-coder-3b-instruct-q4_k_m.gguf" \
              -o "$MODEL"
          fi
          echo "724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7  $MODEL" | sha256sum -c -
      - name: Generate 6 hypotheses with local CPU model, not paid API
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.cache/omega11/llama.cpp/build/bin/llama-server" \
            -m "$HOME/.cache/omega11/model.gguf" -c 4096 -t 4 \
            --host 127.0.0.1 --port 8091 >/tmp/omega11-llama-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json,time,urllib.request
          for _ in range(110):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8091/health",timeout=2) as res:
                      state=json.loads(res.read().decode("utf-8"))
                  if state.get("status")=="ok":
                      print("LOCAL_MODEL_HEALTH_OK")
                      break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("local llama-server did not start")
          PY
          python3 09_INFRASTRUCTURE_AGENTIQUE/llm_proposals11/proposer.py \
            --ledger /tmp/omega11-proposal-events.jsonl \
            --output /tmp/omega11-proposals-raw.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/omega11-proposals-raw.json").read_text())
          assert r["experiment"]=="OMEGA-LLM-PROPOSALS-11"
          assert r["model_calls_attempted"]==6
          assert r["model_transport_success"]==6, r["rows"]
          assert r["paid_api_calls"]==0 and not r["model_weight_training"]
          assert r["candidate_budget_per_case"]==r["lexical_baseline_budget_per_case"]==2
          assert r["semantic_tests_executed"]==0
          assert r["verified_scientific_findings"]==0
          assert r["ledger"]["unique_candidates"]==r["candidates"]
          print({k:r[k] for k in ("model_transport_success","structured_generations",
                "candidates","provenance_valid_candidates","provenance_rejected_candidates",
                "verified_scientific_findings","candidates_sha256_before_gold","ledger")})
          PY
      - name: Archive raw model text and append-only history, even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega11-local-qwen-proposals-and-ledger
          path: |
            /tmp/omega11-proposals-raw.json
            /tmp/omega11-proposal-events.jsonl
            /tmp/omega11-llama-server.log
          retention-days: 30
          if-no-files-found: warn
