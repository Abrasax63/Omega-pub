name: FOUNDATIONS01 LEARN POLICY02 weak-start control
on:
  push:
    branches: [experiment/omega-foundations-selfplay-2026-11-24]
    paths: ['.github/workflows/foundations01-learn-policy02.yml','research/learning_hub/foundations01/learn_policy02.py']
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -u research/learning_hub/foundations01/learn_policy02.py train --out /tmp/policy02.json
      - uses: actions/upload-artifact@v4
        with:
          name: policy02-checkpoint
          path: /tmp/policy02.json
  evaluate:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: policy02-checkpoint
          path: /tmp/policy
      - run: python -u research/learning_hub/foundations01/learn_policy02.py evaluate --checkpoint /tmp/policy/policy02.json --out /tmp/policy02-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: policy02-results
          path: /tmp/policy02-results.json
