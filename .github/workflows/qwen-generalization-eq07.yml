name: EQ07 one-time generalization and retention
on:
  push:
    branches: ['experiment/qwen-generalization-eq07-2026-11-27']
    paths: ['.github/workflows/qwen-generalization-eq07.yml']
permissions:
  contents: read
concurrency:
  group: qwen-generalization-eq07-once
  cancel-in-progress: false
jobs:
  compare:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [271128, 271129, 271130]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Refuse repeated execution
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          if git cat-file -e HEAD^:.github/workflows/qwen-generalization-eq07.yml 2>/dev/null; then exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify dataset fixture
        run: python research/qwen_eq07/generalize.py --fixture
      - name: Install same CPU stack as EQ06
        run: |
          python -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          printf '%s\n' 'torch==2.5.1+cpu' > /tmp/eq07-constraints.txt
          python -m pip install --quiet -c /tmp/eq07-constraints.txt transformers==4.49.0 safetensors==0.5.3 huggingface_hub==0.30.2 jinja2==3.1.6 numpy==1.26.4
      - name: Direct weight training with held-out wording and retention
        run: python -u research/qwen_eq07/generalize.py --seed ${{ matrix.seed }} --out eq07-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eq07-traces-${{ matrix.seed }}
          path: |
            eq07-results/*.json
            eq07-results/*.jsonl
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eq07-experimental-weights-${{ matrix.seed }}
          path: |
            eq07-results/*.safetensors
            eq07-results/weights.jsonl
            eq07-results/manifest.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
