name: Omega targeted one-line Qwen patch with RCE invariants

on:
  pull_request:
    branches:
      - experiment/omega-memory-executable-repair-2026-11-15
    paths:
      - '09_INFRASTRUCTURE_AGENTIQUE/targeted_patch/**'
      - '.github/workflows/omega-targeted-patch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-targeted-patch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify single-line historical patch, safe grammar and RCE binding
        run: |
          set -euo pipefail
          python -m py_compile 09_INFRASTRUCTURE_AGENTIQUE/targeted_patch/targeted_patch.py
          python -m unittest discover -s 09_INFRASTRUCTURE_AGENTIQUE/targeted_patch -p 'test_targeted_patch.py' -v
  two-arm-model-targeted-patch-after-smoke:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests without model or remote inference
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/auto_research
        run: |
          python -m py_compile gate.py runner.py model_proposal.py sandbox_runner.py model_pilot.py
          python -m unittest -v test_gate.py test_variant_search.py test_model_proposal.py
      - name: Pull isolated execution image
        run: |
          docker pull python:3.12-slim
          docker image inspect python:3.12-slim --format '{{json .RepoDigests}}'
      - name: Restore pinned llama.cpp build cache
        uses: actions/cache@v4
        id: llama-cache
        with:
          path: ${{ runner.temp }}/llama.cpp
          key: omega-llama-cpu-5a4afd80779ba51166b59986e61a0bfbb9e1a4c6-v1
      - name: Build pinned llama.cpp CPU inference engine
        if: steps.llama-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth=1 origin 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" -G Ninja \
            -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --target llama-cli -j 4
          "$RUNNER_TEMP/llama.cpp/build/bin/llama-cli" --help >/dev/null
      - name: Restore pinned Qwen model weight cache
        uses: actions/cache@v4
        id: model-cache
        with:
          path: ${{ runner.temp }}/model.gguf
          key: omega-qwen2p5-coder-3b-724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7-v1
      - name: Download verified Qwen2.5 Coder 3B Q4_K_M weights
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/model.gguf" ]]; then
            curl -fL --retry 3 --connect-timeout 30 --max-time 750 \
              "https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/qwen2.5-coder-3b-instruct-q4_k_m.gguf" \
              -o "$RUNNER_TEMP/model.gguf"
          fi
          echo "724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7  $RUNNER_TEMP/model.gguf" | sha256sum -c -
      - name: One Qwen expression per arm and real sandbox / Qh / Delta_h validation
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/targeted_patch
        shell: bash
        run: |
          set -euo pipefail
          python targeted_patch.py \
            --llama-cli "$RUNNER_TEMP/llama.cpp/build/bin/llama-cli" \
            --model-file "$RUNNER_TEMP/model.gguf" \
            --output targeted-patch-result.json
          python - <<'PY'
          import json
          x = json.load(open('targeted-patch-result.json', encoding='utf-8'))
          assert x['provenance']['valid']
          assert x['p3_coverage']['completed'] == 1
          assert x['model_calls'] == 2
          assert len(x['records']) == 2
          assert all(r['returncode'] == 0 for r in x['records'])
          assert x['heldout_manifest_sha256']
          assert len(x['heldout_manifest']['holdout']) == 5
          assert x['old_source_sha256'] == '15fe02b6d5ea993ecb2a64eac02823345a58b631264a8eee081e70a5f3e89314'
          assert x['notes']['scientific_source']['path'].endswith('ALGORITHMIC_PILOT.md')
          assert x['classics']['square-scan']['correct'] == 5
          assert x['classics']['square-lowbit']['correct'] == 5
          assert x['prompt_sha256']['controle_patch'] != x['prompt_sha256']['memoire_patch']
          assert all(r['decision'] in ('REJECTED', 'REVIEW_REQUIRED') for r in x['records'])
          assert not x['promotion_to_core']
          print('New Qwen calls:', x['model_calls'])
          print('Patch status:', [(r['arm'], r['status'], r.get('expression')) for r in x['records']])
          print('Public correctness:', x['comparison']['public_correct'])
          print('Heldout correctness when opened:', x['comparison']['reserved_correct_if_tested'])
          print('Provenance audit valid:', x['provenance']['valid'])
          print('No source promotion or unproven intelligence gain.')
          PY
      - name: Save audit data and candidate source (never merge automatically)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-targeted-patch-two-arm-model
          path: 09_INFRASTRUCTURE_AGENTIQUE/targeted_patch/targeted-patch-result.json
          if-no-files-found: warn
          retention-days: 14
