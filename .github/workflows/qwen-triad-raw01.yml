name: RAW01 single bounded Qwen triad
on:
  push:
    branches: ['experiment/qwen-triad-raw01-2026-11-27']
    paths: ['.github/workflows/qwen-triad-raw01.yml']
permissions:
  contents: read
concurrency:
  group: qwen-triad-raw01-once
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Refuse repeated execution
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          if git cat-file -e HEAD^:.github/workflows/qwen-triad-raw01.yml 2>/dev/null; then exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          printf '%s\n' 'torch==2.5.1+cpu' > /tmp/raw01-constraints.txt
          python -m pip install --quiet -c /tmp/raw01-constraints.txt transformers==4.49.0 safetensors==0.5.3 huggingface_hub==0.30.2 jinja2==3.1.6 numpy==1.26.4
      - name: Check synthetic exam fixture
        run: python research/qwen_raw01/triad.py --fixture
      - name: Direct weight training and uncontrolled answers
        run: python -u research/qwen_raw01/triad.py --out raw01-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw01-synthetic-traces
          path: raw01-results/
          if-no-files-found: warn
          retention-days: 7
