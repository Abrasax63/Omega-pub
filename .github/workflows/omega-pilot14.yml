name: PILOT14 exploratory learning comparison
on:
  push:
    branches: ['experiment/omega-repr01-cpu-diagnostic-2026-11-25']
    paths: ['.github/workflows/omega-pilot14.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: omega-pilot14-single
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One attempt only and offline contracts
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          if git cat-file -e HEAD^:.github/workflows/omega-pilot14.yml 2>/dev/null; then exit 1; fi
          python research/learning_hub/primitive_screen01/transfer13.py selftest
          python research/learning_hub/primitive_screen01/pilot14.py selftest
  arm:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        arm: [base, supervised, contrastive, adaptive]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: realbudget10-results
          run-id: 45660422812
          github-token: ${{ github.token }}
          path: /tmp/pilot-budget
      - name: Pinned CPU stack
        run: |
          python -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers==4.49.0 safetensors==0.5.3 huggingface_hub==0.30.2 peft==0.14.0 jinja2==3.1.6
      - name: Isolated candidate or frozen baseline
        run: python -u research/learning_hub/primitive_screen01/pilot14.py run --arm ${{ matrix.arm }} --budget /tmp/pilot-budget/realbudget10.json --out /tmp/pilot14
      - uses: actions/upload-artifact@v4
        with:
          name: pilot14-${{ matrix.arm }}
          path: |
            /tmp/pilot14/manifest.json
            /tmp/pilot14/predictions.jsonl
            /tmp/pilot14/dev-*.json
  score:
    needs: arm
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: pilot14-*
          path: /tmp/pilot-results
      - name: Score without model access
        run: python research/learning_hub/primitive_screen01/pilot14.py score --root /tmp/pilot-results --out /tmp/pilot14-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: pilot14-results
          path: /tmp/pilot14-result.json
