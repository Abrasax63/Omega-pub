name: Omega ATOMIC-TUTOR-07 - one-shot supervised-context transfer

# Creation-only, branch-scoped workflow. No schedule or manual dispatch.
# Never replay exposed evaluation cases as a fresh independent holdout.
on:
  push:
    branches:
      - experiment/omega-hybrid-learning-gates-2026-11-23
    paths:
      - .github/workflows/omega-hybrid-tutor07-once.yml

permissions:
  contents: read

concurrency:
  group: omega-hybrid-tutor07-one-shot
  cancel-in-progress: false

jobs:
  frozen-prereg-and-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify pre-registration, two oracles and separate training/holdout
        shell: bash
        run: |
          set -euo pipefail
          test -s 09_INFRASTRUCTURE_AGENTIQUE/prism/OMEGA_HYBRID_TUTOR07_PREREG_2026-11-23.md
          python -m py_compile 09_INFRASTRUCTURE_AGENTIQUE/prism/omega_hybrid_tutor07.py
          python -m unittest discover -s 09_INFRASTRUCTURE_AGENTIQUE/prism -p 'test_omega_hybrid_tutor07.py' -v
          PYTHONPATH=09_INFRASTRUCTURE_AGENTIQUE/prism python - <<'PY'
          from hashlib import sha256
          from omega_hybrid_tutor07 import make_holdout,make_training
          from incremental_math_library import canonical
          q,a=make_holdout()
          assert len(q["questions"])==8 and len(a["answers"])==8
          assert sum(int(x["holds"]) for x in a["answers"])==4
          assert len(make_training())==2
          print("FROZEN_SIX_NODE_QUESTIONS",sha256(canonical(q).encode()).hexdigest())
          print("FROZEN_SIX_NODE_ORACLE",sha256(canonical(a).encode()).hexdigest())
          print("NO_ACTUAL_MODEL_TRAINING_PERFORMED_BY_PREREG_JOB")
          PY

  run-frozen-qwen-cpu:
    needs: frozen-prereg-and-offline
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LLAMA_URL: https://github.com/ggml-org/llama.cpp/releases/download/b12633/llama-b12633-bin-ubuntu-x64.tar.gz
      MODEL_URL: https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/main/Qwen2.5-3B-Instruct-Q4_K_M.gguf
      MODEL_SHA: 9c9f56a391a3abbd5b89d0245bf6106081bcc3173119d4229235dd9d23253f94
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download pinned free CPU inference engine and model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tutor07_out "$RUNNER_TEMP/tutor07"
          curl -fLsS --retry 2 --retry-all-errors --max-time 300 "$LLAMA_URL" -o "$RUNNER_TEMP/tutor07/llama.tar.gz"
          tar -xzf "$RUNNER_TEMP/tutor07/llama.tar.gz" -C "$RUNNER_TEMP/tutor07"
          BIN="$(find "$RUNNER_TEMP/tutor07" -type f -name llama-server | head -1)"
          test -n "$BIN"
          chmod +x "$BIN"
          echo "LLAMA_SERVER=$BIN" >> "$GITHUB_ENV"
          curl -fLsS --retry 2 --retry-all-errors --max-time 750 "$MODEL_URL" -o "$RUNNER_TEMP/tutor07/model.gguf"
          test "$(head -c 4 "$RUNNER_TEMP/tutor07/model.gguf")" = "GGUF"
          echo "$MODEL_SHA  $RUNNER_TEMP/tutor07/model.gguf" | sha256sum -c -
          sha256sum "$RUNNER_TEMP/tutor07/model.gguf" > tutor07_out/model.sha256
          "$BIN" --version > tutor07_out/llama-version.txt 2>&1 || true
      - name: Start one pinned local Qwen model, zero paid API calls
        shell: bash
        run: |
          set -euo pipefail
          LIB="$(dirname "$LLAMA_SERVER")"
          LD_LIBRARY_PATH="$LIB" "$LLAMA_SERVER" \
            -m "$RUNNER_TEMP/tutor07/model.gguf" \
            --host 127.0.0.1 --port 8080 -c 4096 -t 2 -ngl 0 \
            > tutor07_out/server.log 2>&1 &
          for i in $(seq 1 100); do
            if curl -sf --max-time 3 http://127.0.0.1:8080/health >/dev/null; then
              echo CPU_LOCAL_MODEL_READY
              exit 0
            fi
            sleep 2
          done
          tail -n 50 tutor07_out/server.log
          exit 1
      - name: One comparison, frozen teacher and six-node held-out graphs
        shell: bash
        run: |
          set -euo pipefail
          timeout 1300 python 09_INFRASTRUCTURE_AGENTIQUE/prism/omega_hybrid_tutor07.py \
            --output tutor07_out --server http://127.0.0.1:8080 \
            2>&1 | tee tutor07_out/summary.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("tutor07_out/report.json").read_text())
          assert r["train_calls"]==4 and r["note_calls"]==2
          assert r["evaluation_calls"]==24
          assert r["model_weights_updated"] is False
          assert r["paid_model_calls"]==0 and r["new_competences_certified"]==0
          assert r["status"] in (
              "POINTWISE_CONTEXT_TRANSFER_OBSERVED",
              "REGISTERED_CONTEXT_GAIN_NOT_OBSERVED",
              "INDETERMINATE_BUDGET")
          print("PREREGISTERED_ATOMIC_TUTOR_VERDICT",r["status"])
          print("NO_PARAMETRIC_LEARNING_OR_GENERAL_SKILL_CERTIFIED")
          PY
      - name: Preserve raw model attempts, teacher feedback and sealed answer keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-hybrid-tutor07-one-shot
          path: tutor07_out/
          retention-days: 7
          if-no-files-found: warn
