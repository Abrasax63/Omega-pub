name: FOUNDATIONS01 MEMORY DAG01 dependency-safe memory
on:
  push:
    branches: [experiment/omega-foundations-selfplay-2026-11-24]
    paths: ['.github/workflows/foundations01-memory-dag01.yml','research/learning_hub/foundations01/memory_dag01.py']
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -u research/learning_hub/foundations01/memory_dag01.py /tmp/dag01.json
      - uses: actions/upload-artifact@v4
        with:
          name: dag01-results
          path: /tmp/dag01.json
