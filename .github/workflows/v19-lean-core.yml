name: V19 Lean core

on:
  pull_request:
    paths:
      - "02_MATHEMATIQUES/defauts_recollement/lean/**"
      - ".github/workflows/v19-lean-core.yml"
  push:
    branches:
      - main
    paths:
      - "02_MATHEMATIQUES/defauts_recollement/lean/**"
      - ".github/workflows/v19-lean-core.yml"

jobs:
  lean-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: false
          leanchecker: false
      - name: Check Lean version
        working-directory: 02_MATHEMATIQUES/defauts_recollement/lean
        run: lean --version
      - name: Compile V19 core
        working-directory: 02_MATHEMATIQUES/defauts_recollement/lean
        run: lean V19Core.lean
