name: EQ02 one-time direct equality pilot
on:
  push:
    branches: ['experiment/qwen-equality-eq02-2026-11-27']
    paths: ['.github/workflows/qwen-equality-eq02.yml']
permissions:
  contents: read
concurrency:
  group: qwen-equality-eq02-once
  cancel-in-progress: false
jobs:
  equality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Refuse repeated execution
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          if git cat-file -e HEAD^:.github/workflows/qwen-equality-eq02.yml 2>/dev/null; then exit 1; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify dataset and scoring controls before installing model
        run: python research/qwen_eq02/equality.py --fixture
      - name: Install same CPU stack as RAW01
        run: |
          python -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          printf '%s\n' 'torch==2.5.1+cpu' > /tmp/eq02-constraints.txt
          python -m pip install --quiet -c /tmp/eq02-constraints.txt transformers==4.49.0 safetensors==0.5.3 huggingface_hub==0.30.2 jinja2==3.1.6 numpy==1.26.4
      - name: Train direct Qwen block and evaluate raw answers
        run: python -u research/qwen_eq02/equality.py --out eq02-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eq02-synthetic-traces
          path: eq02-results/
          if-no-files-found: warn
          retention-days: 7
