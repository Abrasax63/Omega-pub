name: CUMULATIVE18 exact replication and conditional retention
on:
  push:
    branches: ['experiment/omega-repr01-cpu-diagnostic-2026-11-25']
    paths: ['.github/workflows/omega-cumulative18.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: omega-cumulative18-single
  cancel-in-progress: false
jobs:
  cumulative:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One attempt
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          if git cat-file -e HEAD^:.github/workflows/omega-cumulative18.yml 2>/dev/null; then exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          name: realbudget10-results
          run-id: 45660422812
          github-token: ${{ github.token }}
          path: /tmp/c18-budget
      - uses: actions/download-artifact@v4
        with:
          name: retention17-budget
          run-id: 45666014532
          github-token: ${{ github.token }}
          path: /tmp/c18-plan
      - uses: actions/download-artifact@v4
        with:
          name: pilot14-adaptive
          run-id: 45662119374
          github-token: ${{ github.token }}
          path: /tmp/c18-original
      - uses: actions/download-artifact@v4
        with:
          name: pilot14-results
          run-id: 45662119374
          github-token: ${{ github.token }}
          path: /tmp/c18-results
      - name: Pinned CPU stack
        run: |
          python -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers==4.49.0 safetensors==0.5.3 huggingface_hub==0.30.2 peft==0.14.0 jinja2==3.1.6
      - name: Exact first block then conditional two-arm retention
        run: python -u research/learning_hub/primitive_screen01/cumulative18.py --budget /tmp/c18-budget/realbudget10.json --plan /tmp/c18-plan/retention17.json --original /tmp/c18-original --result /tmp/c18-results/pilot14-result.json --out /tmp/c18
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cumulative18-traces
          path: |
            /tmp/c18/*.json
            /tmp/c18/*.jsonl
          if-no-files-found: warn
