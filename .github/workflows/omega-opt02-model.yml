name: Omega OPT02 bounded Qwen optimization and external graph evaluation

on:
  push:
    branches:
      - experiment/omega-strong-baseline-optimization-2026-11-15
    paths:
      - '.github/workflows/omega-opt02-model.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-opt02-prospective
  cancel-in-progress: false

jobs:
  bounded-model-proposals:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    outputs:
      has_champion: ${{ steps.selection.outputs.has_champion }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixed generation budget contract
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/auto_research
        run: |
          python -m py_compile model_proposal.py opt02_generator.py
          python - <<'PY'
          from opt02_generator import CALLS, TOKENS_PER_CALL
          assert (CALLS,TOKENS_PER_CALL) == (3,800)
          PY
      - name: Pull bounded Docker image
        run: |
          docker pull python:3.12-slim
          docker image inspect python:3.12-slim --format '{{json .RepoDigests}}'
      - name: Cache pinned llama.cpp CPU build
        id: cpu-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llama.cpp
          key: omega-llama-cpu-5a4afd80779ba51166b59986e61a0bfbb9e1a4c6-v1
      - name: Build pinned llama.cpp
        if: steps.cpu-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth=1 origin 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" -G Ninja \
            -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --target llama-cli -j 4
      - name: Cache Qwen3B GGUF weights
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/model.gguf
          key: omega-qwen2p5-coder-3b-724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7-v1
      - name: Verify pinned Qwen3B weights
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/model.gguf" ]]; then
            curl -fL --retry 3 --connect-timeout 30 --max-time 750 \
              'https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/qwen2.5-coder-3b-instruct-q4_k_m.gguf' \
              -o "$RUNNER_TEMP/model.gguf"
          fi
          echo "724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7  $RUNNER_TEMP/model.gguf" | sha256sum -c -
      - name: Execute exactly three real Qwen attempts and development-only selection
        id: selection
        shell: bash
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/auto_research
        run: |
          set -euo pipefail
          python opt02_generator.py \
            --llama-cli "$RUNNER_TEMP/llama.cpp/build/bin/llama-cli" \
            --model-file "$RUNNER_TEMP/model.gguf" \
            --output-dir opt02-produced
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.load(open('opt02-produced/generation.json',encoding='utf-8'))
          assert report['model_attempts'] == 3
          assert report['external_corpus_opened'] is False
          ready=report['status']=='CHAMPION_READY_FOR_SEPARATE_EVALUATOR'
          assert ready == Path('opt02-produced/champion.py').is_file()
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('has_champion=' + str(ready).lower() + '\n')
          print('Development-qualified candidate:',ready)
          print('Distinct AST programs:',report['distinct_ast_programs'])
          PY
      - name: Archive all candidate codes, including rejected ones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-opt02-model-proposals
          path: 09_INFRASTRUCTURE_AGENTIQUE/auto_research/opt02-produced/
          if-no-files-found: warn
          retention-days: 30

  separate-external-graph-evaluation:
    needs: bounded-model-proposals
    if: needs.bounded-model-proposals.outputs.has_champion == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install external NetworkX 3.5 graph package (evaluation job only)
        run: python -m pip install --disable-pip-version-check 'networkx==3.5'
      - name: Retrieve immutable selected source and full generation log
        uses: actions/download-artifact@v4
        with:
          name: omega-opt02-model-proposals
          path: 09_INFRASTRUCTURE_AGENTIQUE/auto_research/opt02-produced/
      - name: Pull no-network Python evaluation image
        run: |
          docker pull python:3.12-slim
          docker image inspect python:3.12-slim --format '{{json .RepoDigests}}'
      - name: Once-only independent NetworkX comparison with strong baselines
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/auto_research
        run: |
          python opt02_evaluator.py \
            --champion opt02-produced/champion.py \
            --generation-report opt02-produced/generation.json \
            --output opt02-result.json
          python - <<'PY'
          import json
          x=json.load(open('opt02-result.json',encoding='utf-8'))
          assert x['total_cases']==48 and x['timed_cases']==32
          assert x['repetitions']==9 and x['batch']==20
          assert x['status'] in ('REVIEW_REQUIRED','NO_DEMONSTRATED_ADVANTAGE')
          print('Prospective scientific verdict:',x['status'])
          PY
      - name: Archive scores, provenance and rejected hypotheses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-opt02-external-evaluation
          path: 09_INFRASTRUCTURE_AGENTIQUE/auto_research/opt02-result.json
          if-no-files-found: warn
          retention-days: 30
