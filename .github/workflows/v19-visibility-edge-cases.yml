name: V19 locality — adversarial visibility edge cases

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "research/code/audit_v19_visibility_edge_cases.py"
      - ".github/workflows/v19-visibility-edge-cases.yml"

permissions:
  contents: read

jobs:
  visibility-edge-cases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enumerate targeted edge cases
        run: python research/code/audit_v19_visibility_edge_cases.py
