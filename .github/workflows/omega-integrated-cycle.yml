name: Omega E2E mission-context-code-proof-gate-provenance

on:
  pull_request:
    branches:
      - experiment/omega-free-model-sandbox-pilot-2026-11-15
    paths:
      - '09_INFRASTRUCTURE_AGENTIQUE/integrated_cycle/**'
      - '09_INFRASTRUCTURE_AGENTIQUE/auto_research/model_pilot.py'
      - '.github/workflows/omega-integrated-cycle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test P1/P2/P3 and tamper-evident provenance
        run: |
          set -euo pipefail
          python -m unittest discover -v -s 09_INFRASTRUCTURE_AGENTIQUE/integrated_cycle -p 'test_integrated_cycle.py'
      - name: Run real fixed-template integration pilot against strong classical algorithm
        run: |
          set -euo pipefail
          python 09_INFRASTRUCTURE_AGENTIQUE/integrated_cycle/integrated_cycle.py --mode templates --output cycle-template-result.json
          python - <<'PY'
          import json
          r = json.load(open('cycle-template-result.json', encoding='utf-8'))
          assert r['provenance_validation']['valid']
          assert r['p3']['coverage']['completed'] == 1
          assert r['experiment']['status'] == 'TEMPLATE_ONLY_EXECUTED'
          assert r['experiment']['decision'] == 'REJECTED_TEMPLATE_ONLY'
          assert r['experiment']['holdout_cases'] == 3
          assert not r['experiment']['gain_of_autonomous_intelligence_demonstrated']
          assert not r['promotion_to_core']
          print('Integration, exact reference, strong baseline, gate and provenance verified.')
          PY
      - name: Archive smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-integrated-template-cycle
          path: cycle-template-result.json
          if-no-files-found: warn
          retention-days: 14
  fresh-open-weight-model-and-audit:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests without model or remote inference
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/auto_research
        run: |
          python -m py_compile gate.py runner.py model_proposal.py sandbox_runner.py model_pilot.py
          python -m unittest -v test_gate.py test_variant_search.py test_model_proposal.py
      - name: Pull isolated execution image
        run: |
          docker pull python:3.12-slim
          docker image inspect python:3.12-slim --format '{{json .RepoDigests}}'
      - name: Restore pinned llama.cpp build cache
        uses: actions/cache@v4
        id: llama-cache
        with:
          path: ${{ runner.temp }}/llama.cpp
          key: omega-llama-cpu-5a4afd80779ba51166b59986e61a0bfbb9e1a4c6-v1
      - name: Build pinned llama.cpp CPU inference engine
        if: steps.llama-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth=1 origin 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" -G Ninja \
            -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --target llama-cli -j 4
          "$RUNNER_TEMP/llama.cpp/build/bin/llama-cli" --help >/dev/null
      - name: Restore pinned Qwen model weight cache
        uses: actions/cache@v4
        id: model-cache
        with:
          path: ${{ runner.temp }}/model.gguf
          key: omega-qwen2p5-coder-3b-724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7-v1
      - name: Download verified Qwen2.5 Coder 3B Q4_K_M weights
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$RUNNER_TEMP/model.gguf" ]]; then
            curl -fL --retry 3 --connect-timeout 30 --max-time 750 \
              "https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/qwen2.5-coder-3b-instruct-q4_k_m.gguf" \
              -o "$RUNNER_TEMP/model.gguf"
          fi
          echo "724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7  $RUNNER_TEMP/model.gguf" | sha256sum -c -
      - name: Generate fresh candidate inside the integrated P1/P2/P3 and AutoResearch cycle
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/integrated_cycle
        shell: bash
        run: |
          set -euo pipefail
          python integrated_cycle.py --mode model \
            --llama-cli "$RUNNER_TEMP/llama.cpp/build/bin/llama-cli" \
            --model-file "$RUNNER_TEMP/model.gguf" \
            --model-label "Qwen2.5-Coder-3B-Instruct-GGUF Q4_K_M" \
            --output cycle-model-result.json
          python - <<'PY'
          import json
          x = json.load(open('cycle-model-result.json', encoding='utf-8'))
          assert x['provenance_validation']['valid']
          assert x['p3']['coverage']['completed'] == 1
          assert x['experiment']['model_invocations'] == 2
          assert x['experiment']['manifest_sha256']
          assert x['experiment']['status'] in ('NO_VALID_MODEL_CANDIDATE', 'MODEL_CANDIDATE_EVALUATED')
          assert x['experiment']['decision'] in ('REVIEW_REQUIRED', 'REJECTED')
          print('Model proposals attempted:', x['experiment']['model_invocations'])
          print('Model candidate outcome:', x['experiment']['status'])
          print('Strong-classical decision:', x['experiment']['decision'])
          print('Provenance chain valid:', x['provenance_validation']['valid'])
          print('Actual Qwen run; scientific certification not asserted.')
          PY
      - name: Save audit data and candidate source (never merge automatically)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-integrated-model-cycle
          path: 09_INFRASTRUCTURE_AGENTIQUE/integrated_cycle/cycle-model-result.json
          if-no-files-found: warn
          retention-days: 14
