name: RETENTION17 integer replay allocation
on:
  push:
    branches: ['experiment/omega-repr01-cpu-diagnostic-2026-11-25']
    paths: ['.github/workflows/omega-retention17.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet transformers==4.49.0 safetensors==0.5.3 huggingface_hub==0.30.2 jinja2==3.1.6 numpy==1.26.4 scipy==1.13.1
      - name: Offline optimizer controls
        run: python research/learning_hub/primitive_screen01/retention17.py selftest
      - name: Optimize actual tokenizer budgets before any second block
        run: python research/learning_hub/primitive_screen01/retention17.py preflight --out /tmp/retention17.json
      - uses: actions/upload-artifact@v4
        with:
          name: retention17-budget
          path: /tmp/retention17.json
