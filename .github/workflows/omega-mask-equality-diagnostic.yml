name: Omega mask equality diagnostic
on:
  push:
    branches: [experiment/omega-mask-equality-diagnostic-2026-11-25]
    paths: ['.github/workflows/omega-mask-equality-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pairs and exact oracle before loading the model
        run: python research/learning_hub/mask_equality_diagnostic/diagnostic.py --check
      - name: Install CPU inference dependencies
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.49.0 huggingface_hub==0.30.2 safetensors==0.5.3
      - name: Run frozen model diagnostic
        run: python -u research/learning_hub/mask_equality_diagnostic/diagnostic.py --output mask_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: mask-equality-aggregate-results
          path: mask_result.json
