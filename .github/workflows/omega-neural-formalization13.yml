name: Omega 13 - Qwen neural logic candidates and verified finite search

on:
  pull_request:
    branches:
      - experiment/omega-automatic-countermodel12-2026-11-17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate AST, source correspondence, replay and memory isolation
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/neural_formalization13
        run: |
          set -euo pipefail
          python -m py_compile runner.py test_runner.py
          python -m unittest -v test_runner.py

  real-local-model:
    needs: offline-safety
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore llama.cpp pinned source/build
        uses: actions/cache@v4
        id: llama-cache
        with:
          path: ~/.cache/omega11/llama.cpp
          key: omega11-llama-server-5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
      - name: Verify pinned source and build CPU llama-server
        shell: bash
        run: |
          set -euo pipefail
          BASE="$HOME/.cache/omega11/llama.cpp"
          mkdir -p "$(dirname "$BASE")"
          if [[ ! -f "$BASE/CMakeLists.txt" ]]; then
            git clone --depth 1 --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$BASE"
            git -C "$BASE" fetch --depth=1 origin 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
            git -C "$BASE" checkout --detach 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
          fi
          test "$(git -C "$BASE" rev-parse HEAD)" = "5a4afd80779ba51166b59986e61a0bfbb9e1a4c6"
          if [[ ! -d "$BASE/build" ]]; then
            cmake -S "$BASE" -B "$BASE/build" -G Ninja \
              -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF \
              -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build "$BASE/build" --target llama-server -j 4
      - name: Restore pinned Qwen GGUF
        uses: actions/cache@v4
        id: model-cache
        with:
          path: ~/.cache/omega11/model.gguf
          key: omega11-qwen2p5-coder3b-724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7
      - name: Download weights only if missing, verify SHA256
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$HOME/.cache/omega11/model.gguf"
          mkdir -p "$(dirname "$MODEL")"
          if [[ ! -f "$MODEL" ]]; then
            curl -fL --retry 3 --connect-timeout 30 --max-time 750 \
              "https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/qwen2.5-coder-3b-instruct-q4_k_m.gguf" \
              -o "$MODEL"
          fi
          echo "724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7  $MODEL" | sha256sum -c -
      - name: Propose source-anchored AST on six unseen FOLIO questions
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.cache/omega11/llama.cpp/build/bin/llama-server" \
            -m "$HOME/.cache/omega11/model.gguf" -c 6144 -t 4 \
            --host 127.0.0.1 --port 8091 >/tmp/omega13-llama.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json,time,urllib.request
          for _ in range(120):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8091/health",timeout=2) as res:
                      data=json.loads(res.read())
                  if data.get("status")=="ok":
                      print("LOCAL_QWEN_READY")
                      break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("local model unavailable")
          PY
          base64 -d 09_INFRASTRUCTURE_AGENTIQUE/llm_proposals11/LEDGER_CHECKPOINT_2026-11-17.jsonl.gz.b64 | gunzip > /tmp/omega13-memory.jsonl
          echo '38864b20197b7b2c36f9a65fdffd263c85c4e0d48367a1780475c6cd5b3a23ea  /tmp/omega13-memory.jsonl' | sha256sum -c -
          python3 09_INFRASTRUCTURE_AGENTIQUE/neural_formalization13/runner.py \
            --ledger /tmp/omega13-memory.jsonl \
            --output /tmp/omega13-raw-report.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/omega13-raw-report.json',encoding='utf8'))
          assert r['experiment']=='OMEGA-NEURAL-FORMALIZATION-13'
          assert r['cases']==6
          assert r['sample_blob']=='687571407a6d65dac98d57955d7dc5692139005a'
          assert r['engine_blob']=='f3b0c06e0b1aca3a8a94abd20d89587df52266d2'
          assert r['model_calls_attempted']==6
          assert r['model_transport_succeeded']<=6
          assert r['finite_countermodels_found']<=r['complete_model_formalizations']
          assert r['memory']['events']==18
          assert r['scientific_discoveries_certified']==0
          assert r['semantic_translation_checks_executed']==0
          assert not r['auto_promotion'] and r['paid_api_calls']==0
          assert r['predictions_hash_before_gold']
          print({k:r[k] for k in ('cases','distinct_theories','model_transport_succeeded',
                'valid_json','source_quotes_valid','complete_model_formalizations',
                'strict_baseline_complete','finite_countermodels_found',
                'scientific_discoveries_certified','predictions_hash_before_gold','memory')})
          PY
      - name: Archive hypotheses, conditional witnesses and resumed memory even after failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omega13-qwen-neural-ast-raw-and-resumed-ledger
          path: |
            /tmp/omega13-raw-report.json
            /tmp/omega13-memory.jsonl
            /tmp/omega13-llama.log
          retention-days: 30
          if-no-files-found: warn
