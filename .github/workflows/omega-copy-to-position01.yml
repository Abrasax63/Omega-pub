name: Omega copy to position interference diagnostic
on:
  push:
    branches: [experiment/omega-mask-equality-diagnostic-2026-11-25]
    paths: ['.github/workflows/omega-copy-to-position01.yml']
permissions:
  contents: read
  actions: read
jobs:
  position:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify new matched questions
        run: python research/learning_hub/mask_equality_diagnostic/copy_to_position01.py --check
      - uses: actions/download-artifact@v4
        with:
          name: copy-sft01-adapter
          path: trained
          run-id: '45558296852'
          github-token: ${{ github.token }}
      - name: Install pinned CPU dependencies
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.49.0 huggingface_hub==0.30.2 safetensors==0.5.3 peft==0.14.0 accelerate==1.3.0
      - name: Compare base and frozen adapter on selection and copy
        run: python -u research/learning_hub/mask_equality_diagnostic/copy_to_position01.py --adapter trained --out position
      - uses: actions/upload-artifact@v4
        with:
          name: copy-to-position01-results
          path: position/
