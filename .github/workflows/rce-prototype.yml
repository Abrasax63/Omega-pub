name: RCE prototype tests

on:
  pull_request:
    paths:
      - "09_INFRASTRUCTURE_AGENTIQUE/prototype/**"
      - "09_INFRASTRUCTURE_AGENTIQUE/gateway/**"
      - "09_INFRASTRUCTURE_AGENTIQUE/prism/**"
      - ".github/workflows/rce-prototype.yml"
  push:
    branches:
      - "architecture/memoire-agentique-native-2026-11-05"
    paths:
      - "09_INFRASTRUCTURE_AGENTIQUE/prototype/**"
      - "09_INFRASTRUCTURE_AGENTIQUE/gateway/**"
      - "09_INFRASTRUCTURE_AGENTIQUE/prism/**"
      - ".github/workflows/rce-prototype.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run standard-library unit tests
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/prototype
        run: python -m unittest -v
      - name: Run adaptive prism planner unit tests
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/prism
        run: python -m unittest -v
      - name: Run MCP gateway unit tests
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/gateway
        run: python -m unittest -v
      - name: Smoke test against the repository indexes
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/prototype
        run: |
          python rce.py --repo ../.. --question "BR-R90-01 noyaux période" --role formalist --output /tmp/omega-rce-result.json
          python -c "import json; d=json.load(open('/tmp/omega-rce-result.json', encoding='utf-8')); assert d['registered_results'], 'No indexed result retrieved'; assert d['registered_results'][0]['publication_status'].startswith('EXPÉRIMENTAL'); assert d['manifest']['mode'] == 'read_only_local_checkout'; print('Repository index smoke test: OK')"
          python rce.py --repo ../.. --question "CL-DYN migration mathématiques" --role refuter --output /tmp/omega-rce-pending.json
          python -c "import json; d=json.load(open('/tmp/omega-rce-pending.json', encoding='utf-8')); assert d['pending_migration_items'], 'Pending migration items were not retrieved'; print('Pending migration smoke test: OK')"

  provenance-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect and analyze real GitHub Actions journals
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/prism
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python provenance_agent.py "$GITHUB_REPOSITORY" 43374750280 a > "$RUNNER_TEMP/omega-audit.json" || {
            cat "$RUNNER_TEMP/omega-audit.json"
            exit 1
          }
          python -c 'import json, sys; audit = json.load(open(sys.argv[1])); verdicts = {row["nom"]: row["verdict"] for row in audit["verdicts"]}; assert verdicts == {"Candidate alpha": "recalcul", "Candidate beta": "copie"}, verdicts; print(verdicts)' "$RUNNER_TEMP/omega-audit.json"

  provenance-lab-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      matrix:
        partition: [build, reserved]
    steps:
      - name: Produce identical files with different histories
        env:
          PARTITION: ${{ matrix.partition }}
        shell: bash
        run: |
          mkdir -p evidence
          printf '%s\n' 506 > original.json
          set -x
          if [[ "$PARTITION" == build ]]; then
            python3 -c 'from pathlib import Path; Path("evidence/build-a.json").write_text(str(sum(i*i for i in range(1,12)))+chr(10))'
            cp original.json evidence/build-b.json
          else
            cp original.json evidence/reserved-a.json
            python3 -c 'from pathlib import Path; Path("evidence/reserved-b.json").write_text(str(sum(i*i for i in range(1,12)))+chr(10))'
            set +x
            cp original.json evidence/reserved-c.json
          fi
          set +x
          sha256sum evidence/*.json
