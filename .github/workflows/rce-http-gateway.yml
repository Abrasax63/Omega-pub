name: RCE HTTP gateway tests

on:
  pull_request:
    paths:
      - "app.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "09_INFRASTRUCTURE_AGENTIQUE/prototype/**"
      - "09_INFRASTRUCTURE_AGENTIQUE/gateway/**"
      - "09_INFRASTRUCTURE_AGENTIQUE/gateway_http/**"
      - ".github/workflows/rce-http-gateway.yml"
  push:
    branches:
      - "architecture/memoire-agentique-native-2026-11-05"
    paths:
      - "app.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "09_INFRASTRUCTURE_AGENTIQUE/prototype/**"
      - "09_INFRASTRUCTURE_AGENTIQUE/gateway/**"
      - "09_INFRASTRUCTURE_AGENTIQUE/gateway_http/**"
      - ".github/workflows/rce-http-gateway.yml"

permissions:
  contents: read

jobs:
  http-gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP gateway test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run HTTP gateway tests
        run: python -m unittest discover -s 09_INFRASTRUCTURE_AGENTIQUE/gateway_http -v
