name: Omega self-indexing transfer on longer sequences
on:
  push:
    branches: [experiment/omega-mask-equality-diagnostic-2026-11-25]
    paths: ['.github/workflows/omega-self-representation03.yml']
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify new corpus and existing parser
        run: python research/learning_hub/mask_equality_diagnostic/self_representation03.py --check
      - name: Install pinned CPU dependencies
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.49.0 huggingface_hub==0.30.2 safetensors==0.5.3
      - name: Test transfer and end-to-end exploitation
        run: python -u research/learning_hub/mask_equality_diagnostic/self_representation03.py --output selfrep03
      - uses: actions/upload-artifact@v4
        with:
          name: omega-self-representation03-results
          path: selfrep03/
