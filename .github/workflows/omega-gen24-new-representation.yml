name: Omega GEN24 - Qwen generates an unfamiliar representation before hidden exact checks

on:
  push:
    branches:
      - experiment/omega-generative-shift24-2026-11-19
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-gen24-first-idea-before-oracle
  cancel-in-progress: false

jobs:
  offline-frozen-cohort-and-interpreter:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source pins, 64 gold labels, independent baselines, AST safety and metamorphisms
        run: |
          cd 09_INFRASTRUCTURE_AGENTIQUE/generative_shift24
          python -m unittest -v test_gen24.py

  real-llm-ideation-and-blind-evaluation:
    needs: offline-frozen-cohort-and-interpreter
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore pinned llama.cpp source and CPU build
        uses: actions/cache@v4
        with:
          path: ~/.cache/omega11/llama.cpp
          key: omega11-llama-server-5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
      - name: Verify exact pinned llama.cpp commit and build CPU server
        shell: bash
        run: |
          set -euo pipefail
          BASE="$HOME/.cache/omega11/llama.cpp"
          mkdir -p "$(dirname "$BASE")"
          if [[ ! -f "$BASE/CMakeLists.txt" ]]; then
            git clone --depth 1 --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$BASE"
            git -C "$BASE" fetch --depth=1 origin 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
            git -C "$BASE" checkout --detach 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
          fi
          test "$(git -C "$BASE" rev-parse HEAD)" = "5a4afd80779ba51166b59986e61a0bfbb9e1a4c6"
          cmake -S "$BASE" -B "$BASE/build" -G Ninja \
            -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$BASE/build" --target llama-server -j 4
      - name: Restore pinned local 3B model, zero paid API
        uses: actions/cache@v4
        with:
          path: ~/.cache/omega11/model.gguf
          key: omega11-qwen2p5-coder3b-724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7
      - name: Download public weights if needed and check SHA256
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$HOME/.cache/omega11/model.gguf"
          mkdir -p "$(dirname "$MODEL")"
          if [[ ! -f "$MODEL" ]]; then
            curl -fL --retry 3 --connect-timeout 30 --max-time 750 \
              "https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/qwen2.5-coder-3b-instruct-q4_k_m.gguf" -o "$MODEL"
          fi
          echo "724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7  $MODEL" | sha256sum -c -
      - name: Ask local Qwen for TWO free-form representation ideas BEFORE revealing formal DSL
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.cache/omega11/llama.cpp/build/bin/llama-server" \
            -m "$HOME/.cache/omega11/model.gguf" -c 8192 -t 4 \
            --host 127.0.0.1 --port 8091 > /tmp/omega-gen24-llama.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import json,time,urllib.request
          for _ in range(120):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8091/health',timeout=2) as x:
                      if json.loads(x.read()).get('status')=='ok':
                          print('PINNED_QWEN_3B_READY',flush=True)
                          break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit('MODEL_NOT_AVAILABLE_INFRASTRUCTURE')
          PY
          python 09_INFRASTRUCTURE_AGENTIQUE/generative_shift24/propose.py \
            --output /tmp/omega-gen24/01-raw-unscored-model-ideas.json
      - name: Seal all candidate decisions from held-out cases, WITHOUT opening gold labels
        run: |
          python 09_INFRASTRUCTURE_AGENTIQUE/generative_shift24/evaluate.py \
            --mode predict \
            --proposal /tmp/omega-gen24/01-raw-unscored-model-ideas.json \
            --output /tmp/omega-gen24/02-sealed-predictions-before-gold.json
      - name: Evaluate hidden oracle and strong gaussian baseline AFTER prediction hash
        run: |
          python 09_INFRASTRUCTURE_AGENTIQUE/generative_shift24/evaluate.py \
            --mode audit \
            --predictions /tmp/omega-gen24/02-sealed-predictions-before-gold.json \
            --output /tmp/omega-gen24/03-post-decision-independent-audit.json
      - name: Enforce provenance, actual model calls and no false scientific claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/omega-gen24')
          model=json.loads((root/'01-raw-unscored-model-ideas.json').read_text(encoding='utf8'))
          pred=json.loads((root/'02-sealed-predictions-before-gold.json').read_text(encoding='utf8'))
          audit=json.loads((root/'03-post-decision-independent-audit.json').read_text(encoding='utf8'))
          assert model['status']=='COMPLETED_REAL_MODEL_INFERENCE'
          assert model['model_calls']==4 and model['paid_api_calls']==0
          assert all(len(r['idea_before_DSL']['reply_sha256'])==64 for r in model['results'])
          assert all(not r['feedback_from_oracle_seen'] for r in model['results'])
          assert pred['status']=='FROZEN_CANDIDATE_DECISIONS'
          assert pred['total_predictions']==512 and not pred['gold_loaded']
          assert audit['status']=='SCORED_REAL_MODEL_PROPOSALS'
          assert audit['A_direct_bfs_exact']==64 and audit['D_strong_gaussian_exact']==64
          assert audit['case_count']==64 and audit['metamorphic_cases']==192
          assert audit['predictions_sha256_before_gold']==pred['stable_decisions_sha256_before_gold']
          assert not audit['new_scientific_theorem']
          assert not audit['open_ended_creativity_demonstrated']
          assert not audit['runtime_budget_equalized']
          assert audit['automatic_certifications']==0
          print('GEN24_MODEL_REAL',model['model'], 'calls',model['model_calls'])
          print('GEN24_RUBRIC',[(x['prompt_id'],x['classification'],
                 x['correct_original'],x['wrong_original'],x['abstentions_all_256'])
                for x in audit['model_arm_results']])
          print('SEALED_SHA256',audit['predictions_sha256_before_gold'])
          PY
      - name: Archive raw model outputs, sealed pre-gold predictions, audit and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-gen24-real-model-free-idea-vs-strong-oracle
          path: |
            /tmp/omega-gen24/
            /tmp/omega-gen24-llama.log
          retention-days: 30
          if-no-files-found: warn
