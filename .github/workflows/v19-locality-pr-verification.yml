name: V19 locality L+2 — exhaustive small-model check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "research/code/verify_v19_locality_exhaustive_small.py"
      - "02_MATHEMATIQUES/defauts_recollement/sources/V19/NOTE_RECHERCHE_V19_GRAMMAIRE_ORBITALE_2.md"
      - "02_MATHEMATIQUES/defauts_recollement/AUDIT_INDEPENDANT_LOCALITE_V19_L_PLUS_2_2026-11-05.md"
      - "02_MATHEMATIQUES/defauts_recollement/lean/**"
      - ".github/workflows/v19-locality-pr-verification.yml"

permissions:
  contents: read

jobs:
  exhaustive-small-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exhaustive coherent C3 extensions, N <= 7, L in {2,3}
        run: python research/code/verify_v19_locality_exhaustive_small.py
      - name: Install pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile V19 Lean core
        working-directory: 02_MATHEMATIQUES/defauts_recollement/lean
        run: lean V19Core.lean
