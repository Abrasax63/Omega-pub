name: Omega 14 - compositional logic proposals and countermodel replay

on:
  pull_request:
    branches:
      - experiment/omega-neural-formalization13-2026-11-17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate finite logic, independent replay, no semantic overclaim
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/compositional_logic14
        run: |
          set -euo pipefail
          python -m py_compile finite_logic.py runner.py test_compositional.py
          python -m unittest -v test_compositional.py

  local-qwen-compositional:
    needs: offline-falsification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore pinned llama.cpp
        uses: actions/cache@v4
        with:
          path: ~/.cache/omega11/llama.cpp
          key: omega11-llama-server-5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
      - name: Verify and build CPU llama-server
        shell: bash
        run: |
          set -euo pipefail
          BASE="$HOME/.cache/omega11/llama.cpp"
          mkdir -p "$(dirname "$BASE")"
          if [[ ! -f "$BASE/CMakeLists.txt" ]]; then
            git clone --depth 1 --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$BASE"
            git -C "$BASE" fetch --depth=1 origin 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
            git -C "$BASE" checkout --detach 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
          fi
          test "$(git -C "$BASE" rev-parse HEAD)" = "5a4afd80779ba51166b59986e61a0bfbb9e1a4c6"
          if [[ ! -d "$BASE/build" ]]; then
            cmake -S "$BASE" -B "$BASE/build" -G Ninja \
              -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF \
              -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build "$BASE/build" --target llama-server -j 4
      - name: Restore pinned Qwen model
        uses: actions/cache@v4
        with:
          path: ~/.cache/omega11/model.gguf
          key: omega11-qwen2p5-coder3b-724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7
      - name: Verify Qwen weights (fetch only if missing)
        shell: bash
        run: |
          set -euo pipefail
          MODEL="$HOME/.cache/omega11/model.gguf"
          mkdir -p "$(dirname "$MODEL")"
          if [[ ! -f "$MODEL" ]]; then
            curl -fL --retry 3 --connect-timeout 30 --max-time 750 \
              "https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/qwen2.5-coder-3b-instruct-q4_k_m.gguf" \
              -o "$MODEL"
          fi
          echo "724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7  $MODEL" | sha256sum -c -
      - name: Generate six new unrestricted hypotheses and typed expressions
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.cache/omega11/llama.cpp/build/bin/llama-server" \
            -m "$HOME/.cache/omega11/model.gguf" -c 8192 -t 4 \
            --host 127.0.0.1 --port 8091 >/tmp/omega14-llama-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json,time,urllib.request
          for _ in range(130):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8091/health",timeout=2) as res:
                      status=json.loads(res.read())
                  if status.get("status")=="ok":
                      print("LOCAL_QWEN_READY")
                      break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("local model not ready")
          PY
          base64 -d 09_INFRASTRUCTURE_AGENTIQUE/llm_proposals11/LEDGER_CHECKPOINT_2026-11-17.jsonl.gz.b64 | gunzip > /tmp/omega14-hypotheses.jsonl
          echo '38864b20197b7b2c36f9a65fdffd263c85c4e0d48367a1780475c6cd5b3a23ea  /tmp/omega14-hypotheses.jsonl' | sha256sum -c -
          python3 09_INFRASTRUCTURE_AGENTIQUE/compositional_logic14/runner.py \
            --ledger /tmp/omega14-hypotheses.jsonl \
            --output /tmp/omega14-raw-evidence.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/omega14-raw-evidence.json',encoding='utf8'))
          assert d['cases']==6
          assert d['source_slice_blob']=='50762a7e830cf7df2ff445ab6d5e8220e5ad73f8'
          assert d['model_calls_requested']==6
          assert d['transport_successes']<=6
          assert d['json_decoded']<=d['transport_successes']
          assert d['conditional_finite_witnesses']<=d['complete_translations']
          assert d['semantic_fidelity_certified']==d['scientific_discoveries_certified']==0
          assert not d['auto_promotion'] and d['paid_api_calls']==0
          assert d['memory']['events']==18
          assert d['predictions_sha256_before_gold']
          print({k:d[k] for k in ('cases','distinct_theories','transport_successes',
                'json_decoded','free_ideas_preserved','premises_structurally_proposed',
                'complete_translations','conditional_finite_witnesses',
                'semantic_surface_alarms','predictions_sha256_before_gold','memory')})
          PY
      - name: Archive unverified ideas and checked finite witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega14-compositional-ideas-ast-and-finite-witnesses
          path: |
            /tmp/omega14-raw-evidence.json
            /tmp/omega14-hypotheses.jsonl
            /tmp/omega14-llama-server.log
          retention-days: 30
          if-no-files-found: warn
