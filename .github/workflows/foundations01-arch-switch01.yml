name: FOUNDATIONS01 ARCH SWITCH01 residual architecture transitions
on:
  push:
    branches: [experiment/omega-foundations-selfplay-2026-11-24]
    paths: ['.github/workflows/foundations01-arch-switch01.yml','research/learning_hub/foundations01/arch_switch01.py']
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -u research/learning_hub/foundations01/arch_switch01.py /tmp/arch-switch01.json
      - uses: actions/upload-artifact@v4
        with:
          name: arch-switch01-results
          path: /tmp/arch-switch01.json
