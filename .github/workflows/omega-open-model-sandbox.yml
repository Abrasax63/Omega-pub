name: Omega open-weight model code proposal sandbox pilot

on:
  push:
    branches:
      - experiment/omega-free-model-sandbox-pilot-2026-11-15
    paths:
      - '09_INFRASTRUCTURE_AGENTIQUE/auto_research/**'
      - '.github/workflows/omega-open-model-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-open-model-sandbox-pilot
  cancel-in-progress: false

jobs:
  cpu-open-weight-inference-and-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests without model or remote inference
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/auto_research
        run: |
          python -m py_compile gate.py runner.py model_proposal.py sandbox_runner.py model_pilot.py
          python -m unittest -v test_gate.py test_variant_search.py test_model_proposal.py
      - name: Pull isolated execution image
        run: |
          docker pull python:3.12-slim
          docker image inspect python:3.12-slim --format '{{json .RepoDigests}}'
      - name: Build pinned llama.cpp CPU inference engine
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth=1 origin 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach 5a4afd80779ba51166b59986e61a0bfbb9e1a4c6
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" -G Ninja \
            -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --target llama-cli -j 4
          "$RUNNER_TEMP/llama.cpp/build/bin/llama-cli" --help >/dev/null
      - name: Download verified Qwen2.5 Coder 1.5B Q4_K_M weights
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 --max-time 750 \
            "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf" \
            -o "$RUNNER_TEMP/model.gguf"
          echo "cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046  $RUNNER_TEMP/model.gguf" | sha256sum -c -
      - name: Generate real candidate source and test in no-network containers
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/auto_research
        shell: bash
        run: |
          set -euo pipefail
          python model_pilot.py \
            --llama-cli "$RUNNER_TEMP/llama.cpp/build/bin/llama-cli" \
            --model-file "$RUNNER_TEMP/model.gguf" \
            --output model-result.json
          python - <<'PY'
          import json
          x = json.load(open('model-result.json', encoding='utf-8'))
          assert x['model_invocations'] == 2
          assert x['manifest_sha256']
          assert x['status'] in ('NO_VALID_MODEL_CANDIDATE', 'MODEL_CANDIDATE_EVALUATED')
          print('Model proposals attempted:', x['model_invocations'])
          print('Candidate validation outcome:', x['status'])
          print('Holdout opened:', x['holdout_opened'])
          print('Real inference run; no gain assumed or forced.')
          PY
      - name: Save audit data and candidate source (never merge automatically)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-open-model-code-proposals
          path: 09_INFRASTRUCTURE_AGENTIQUE/auto_research/model-result.json
          if-no-files-found: warn
          retention-days: 14
