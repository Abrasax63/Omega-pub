name: RELATION20 reproduced adaptive instruction switch
on:
  push:
    branches: ['experiment/omega-repr01-cpu-diagnostic-2026-11-25']
    paths: ['.github/workflows/omega-relation20.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: omega-relation20-single
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline controls and one attempt
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          if git cat-file -e HEAD^:.github/workflows/omega-relation20.yml 2>/dev/null; then exit 1; fi
          python research/learning_hub/primitive_screen01/relation19.py selftest
      - uses: actions/download-artifact@v4
        with:
          name: realbudget10-results
          run-id: 45660422812
          github-token: ${{ github.token }}
          path: /tmp/r20-budget
      - uses: actions/download-artifact@v4
        with:
          name: pilot14-adaptive
          run-id: 45662119374
          github-token: ${{ github.token }}
          path: /tmp/r20-original
      - uses: actions/download-artifact@v4
        with:
          name: pilot14-results
          run-id: 45662119374
          github-token: ${{ github.token }}
          path: /tmp/r20-results
      - uses: actions/download-artifact@v4
        with:
          name: relation19-baseline
          run-id: 45668859404
          github-token: ${{ github.token }}
          path: /tmp/r20-base
      - name: Pinned CPU stack
        run: |
          python -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers==4.49.0 safetensors==0.5.3 huggingface_hub==0.30.2 peft==0.14.0 jinja2==3.1.6
      - name: Exact adaptive reproduction then frozen RELATION19 comparison
        run: python -u research/learning_hub/primitive_screen01/relation20.py --budget /tmp/r20-budget/realbudget10.json --original /tmp/r20-original --result /tmp/r20-results/pilot14-result.json --baseline /tmp/r20-base --out /tmp/r20
      - uses: actions/upload-artifact@v4
        with:
          name: relation20-results
          path: /tmp/r20/*.json
