name: Omega OPT02 one-shot replay of archived Qwen source (zero extra model calls)

on:
  push:
    branches:
      - experiment/omega-strong-baseline-optimization-2026-11-15
    paths:
      - '.github/workflows/omega-opt02-replay.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: omega-opt02-replay-original-source
  cancel-in-progress: false

jobs:
  replay-original-infrastructure-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      has_champion: ${{ steps.decision.outputs.has_champion }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch ORIGINAL three proposal responses from the earlier GitHub run
        uses: actions/download-artifact@v4
        with:
          name: omega-opt02-model-proposals
          run-id: 43746056945
          github-token: ${{ github.token }}
          path: 09_INFRASTRUCTURE_AGENTIQUE/auto_research/opt02-original/
      - name: Verify identical original log SHA (never regenerate proposals)
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/auto_research
        run: |
          echo '35e5818fcccc239e38e315d164ce0938047e5909190b7b33403251dfd1b66a04  opt02-original/generation.json' | sha256sum -c -
          python -m py_compile opt02_replay.py opt02_generator.py
      - name: Pull read-only runtime
        run: docker pull python:3.12-slim
      - name: Re-evaluate only original candidate with corrected non-root permissions
        id: decision
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/auto_research
        shell: bash
        run: |
          set -euo pipefail
          python opt02_replay.py \
            --original-json opt02-original/generation.json \
            --output-dir opt02-replayed
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path('opt02-replayed/generation.json').read_text())
          assert a['model_attempts']==3
          assert a['replay_type']=='INFRASTRUCTURE_ONLY_PERMISSION_REPAIR_NO_NEW_INFERENCE'
          eligible=(a['status']=='CHAMPION_READY_FOR_SEPARATE_EVALUATOR')
          assert eligible == Path('opt02-replayed/champion.py').is_file()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('has_champion='+str(eligible).lower()+'\n')
          print('No new LLM tokens; holdout opened:', False)
          PY
      - name: Archive immutable model replay provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-opt02-replayed-original-proposals
          path: 09_INFRASTRUCTURE_AGENTIQUE/auto_research/opt02-replayed/
          if-no-files-found: warn
          retention-days: 30

  separate-networkx-evaluator:
    needs: replay-original-infrastructure-failure
    if: needs.replay-original-infrastructure-failure.outputs.has_champion == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install external NetworkX graphs in the evaluator job only
        run: python -m pip install --disable-pip-version-check 'networkx==3.5'
      - name: Read original candidate frozen after independent development selection
        uses: actions/download-artifact@v4
        with:
          name: omega-opt02-replayed-original-proposals
          path: 09_INFRASTRUCTURE_AGENTIQUE/auto_research/opt02-replayed/
      - name: Pull bounded no-network Python container
        run: |
          docker pull python:3.12-slim
          docker image inspect python:3.12-slim --format '{{json .RepoDigests}}'
      - name: First external-data evaluation of the recovered ORIGINAL program
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/auto_research
        run: |
          python opt02_evaluator.py \
            --champion opt02-replayed/champion.py \
            --generation-report opt02-replayed/generation.json \
            --output opt02-result.json
          python - <<'PY'
          import json
          x=json.load(open('opt02-result.json'))
          assert (x['total_cases'],x['timed_cases'],x['repetitions'],x['batch']) == (48,32,9,20)
          assert x['status'] in ('NO_DEMONSTRATED_ADVANTAGE','REVIEW_REQUIRED')
          print('Original program result, independent classical comparator:',x['status'])
          PY
      - name: Archive complete positive or negative independent evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-opt02-original-strong-classical-evaluation
          path: 09_INFRASTRUCTURE_AGENTIQUE/auto_research/opt02-result.json
          if-no-files-found: warn
          retention-days: 30
