name: Omega mathematics self-education via public web sources (pilot)

on:
  pull_request:
    paths:
      - ".github/workflows/omega-math-web-learning-pilot.yml"
      - "09_INFRASTRUCTURE_AGENTIQUE/prism/math_web_learning_pilot.py"
      - "09_INFRASTRUCTURE_AGENTIQUE/prism/test_math_web_learning_pilot.py"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: omega-math-web-learning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate web research contract without model or web requests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s 09_INFRASTRUCTURE_AGENTIQUE/prism \
            -p test_math_web_learning_pilot.py -v

  experiment:
    # One-shot initial run already executed and archived in #45056407124.
    # Never rerun the same exposed test page after inspecting its outcome.
    if: github.event_name == 'workflow_dispatch' && false
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SOURCE_URL: https://www.math.uwaterloo.ca/~mrubinst/alpoge_claude_grh/zeta-paper.pdf
      LLAMA_BIN_URL: https://github.com/ggml-org/llama.cpp/releases/download/b12633/llama-b12633-bin-ubuntu-x64.tar.gz
      MODEL_URL: https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/d71b21e09fe053c278d73092a855b8a99684693a/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test honest query generation, host restriction, and provenance rules
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s 09_INFRASTRUCTURE_AGENTIQUE/prism \
            -p test_math_web_learning_pilot.py -v | tee "$RUNNER_TEMP/web-learning-tests.log"
      - name: Acquire original PDF and model-free source page
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p "$RUNNER_TEMP/weblearn"
          curl -fsSL --retry 2 --max-time 180 "$SOURCE_URL" -o "$RUNNER_TEMP/weblearn/source.pdf"
          test "$(stat -c %s "$RUNNER_TEMP/weblearn/source.pdf")" -ge 100000
          PDF_SHA="$(sha256sum "$RUNNER_TEMP/weblearn/source.pdf" | awk '{print $1}')"
          test "$PDF_SHA" = '667d88b3c375adf0466678094f452ca966aef0f4d368f6340d2bd5328b7fb706'
          echo "PDF_SHA=$PDF_SHA" >> "$GITHUB_ENV"
          pdftotext -f 6 -l 6 -layout "$RUNNER_TEMP/weblearn/source.pdf" "$RUNNER_TEMP/weblearn/primary-page.txt"
          test "$(wc -c < "$RUNNER_TEMP/weblearn/primary-page.txt")" -gt 200
          sha256sum "$RUNNER_TEMP/weblearn/primary-page.txt" \
            | tee "$RUNNER_TEMP/weblearn/page-sha256.txt"
      - name: Set up model using previously verified free local model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 2 --max-time 240 "$LLAMA_BIN_URL" -o "$RUNNER_TEMP/bin/llama.tar.gz"
          tar -xzf "$RUNNER_TEMP/bin/llama.tar.gz" -C "$RUNNER_TEMP/bin"
          BIN="$(find "$RUNNER_TEMP/bin" -type f -name llama-server | head -1)"
          test -n "$BIN"
          chmod +x "$BIN"
          echo "LLAMA_SERVER=$BIN" >> "$GITHUB_ENV"
          curl -fsSL --retry 2 --max-time 400 "$MODEL_URL" -o "$RUNNER_TEMP/bin/model.gguf"
          test "$(head -c 4 "$RUNNER_TEMP/bin/model.gguf")" = 'GGUF'
          MODEL_SHA="$(sha256sum "$RUNNER_TEMP/bin/model.gguf" | awk '{print $1}')"
          test "$MODEL_SHA" = '6eb923e7d26e9cea28811e1a8e852009b21242fb157b26149d3b188f3a8c8653'
          echo "MODEL_SHA=$MODEL_SHA" >> "$GITHUB_ENV"
      - name: Run local CPU inference, no paid API
        shell: bash
        run: |
          set -euo pipefail
          LIB="$(dirname "$LLAMA_SERVER")"
          LD_LIBRARY_PATH="$LIB:${LD_LIBRARY_PATH:-}" "$LLAMA_SERVER" -m "$RUNNER_TEMP/bin/model.gguf" \
            --host 127.0.0.1 --port 8080 -c 6144 -t 2 -ngl 0 \
            > "$RUNNER_TEMP/weblearn/llama-server.log" 2>&1 &
          for i in $(seq 1 80); do
            if curl --max-time 2 -sf http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 30 "$RUNNER_TEMP/weblearn/llama-server.log"
          exit 1
      - name: Omega chooses its own mathematical web query and compares both arms
        shell: bash
        run: |
          set -euo pipefail
          timeout 480 python 09_INFRASTRUCTURE_AGENTIQUE/prism/math_web_learning_pilot.py \
            --original-page "$RUNNER_TEMP/weblearn/primary-page.txt" \
            --pdf-sha256 "$PDF_SHA" \
            --output "$RUNNER_TEMP/weblearn/result.json" | tee "$RUNNER_TEMP/weblearn/summary.log"
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"weblearn/result.json"
          r=json.loads(p.read_text())
          assert r["scientific_discoveries"] == 0
          if r["status"].startswith("REAL_WEB"):
              assert r["manually_curated_search_terms"]==0
              assert r["manual_semantic_structures_supplied"]==0
              assert r["same_model_same_question_same_output_token_cap"]
              assert len(r["retrieval"]["sources"]) <= 2
              assert not r["direct_guard"].get("theorem_certified", False)
              assert not r["web_guard"].get("theorem_certified", False)
          else:
              assert r["status"]=="BLOCKED_NO_GROUNDED_EXTERNAL_MATERIAL"
          print("Experiment recorded, no scientific correctness promoted")
          PY
      - name: Archive manifests and model outputs only (no PDF or weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-math-web-learning-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/web-learning-tests.log
            ${{ runner.temp }}/weblearn/page-sha256.txt
            ${{ runner.temp }}/weblearn/summary.log
            ${{ runner.temp }}/weblearn/result.json
          retention-days: 7
          if-no-files-found: warn
