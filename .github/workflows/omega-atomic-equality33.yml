name: ATOMIC33 frozen Qwen equality from two examples
on:
  push:
    branches: ['experiment/omega-repr01-cpu-diagnostic-2026-11-25']
    paths: ['.github/workflows/omega-atomic-equality33.yml']
permissions:
  contents: read
concurrency:
  group: omega-atomic-equality33-single
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One bounded inference launch
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          if git cat-file -e HEAD^:.github/workflows/omega-atomic-equality33.yml 2>/dev/null; then exit 1; fi
          python research/learning_hub/primitive_screen01/atomic_equality33.py selftest
      - name: Fixed CPU stack
        run: |
          python -m pip install --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          echo 'torch==2.5.1+cpu' > /tmp/atomic33-constraints.txt
          python -m pip install --quiet --constraint /tmp/atomic33-constraints.txt transformers==4.49.0 safetensors==0.5.3 huggingface_hub==0.30.2 accelerate==1.3.0 jinja2==3.1.6 numpy==1.26.4
          python -c "import torch; assert torch.__version__ == '2.5.1+cpu' and torch.version.cuda is None"
      - name: Sixteen responses and zero weight updates
        run: python -u research/learning_hub/primitive_screen01/atomic_equality33.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atomic-equality33-report
          path: /tmp/atomic-equality33/*.json
          if-no-files-found: warn
