name: FOUNDATIONS01 RESOURCE LEARN01 adaptive resources
on:
  push:
    branches: [experiment/omega-foundations-selfplay-2026-11-24]
    paths: ['.github/workflows/foundations01-resource-learn01.yml','research/learning_hub/foundations01/resource_learn01.py']
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -u research/learning_hub/foundations01/resource_learn01.py train --out /tmp/resource01.json
      - uses: actions/upload-artifact@v4
        with:
          name: resource01-checkpoint
          path: /tmp/resource01.json
  evaluate:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: resource01-checkpoint
          path: /tmp/resource
      - run: python -u research/learning_hub/foundations01/resource_learn01.py evaluate --checkpoint /tmp/resource/resource01.json --out /tmp/resource01-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: resource01-results
          path: /tmp/resource01-results.json
