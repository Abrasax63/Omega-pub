name: Omega REAL-02 memory reuse - one-shot CPU, no paid API

# One attempt when THIS workflow file is first introduced/changed on the PR.
# Not scheduled, does not edit repository files, never writes to main.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/omega-memory-real02.yml"

permissions:
  contents: read

concurrency:
  group: omega-memory-real02-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prereg-and-offline-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Protocol frozen and syntax checked before any model calls
        shell: bash
        run: |
          set -euo pipefail
          test -s 09_INFRASTRUCTURE_AGENTIQUE/prism/OMEGA_LIBRARY_MEMORY_REAL_02_PREREG_2026-11-23.md
          python -m py_compile 09_INFRASTRUCTURE_AGENTIQUE/prism/omega_memory_real02.py
          python -m unittest discover -s 09_INFRASTRUCTURE_AGENTIQUE/prism -p 'test_omega_memory_real02.py' -v
          python -m unittest discover -s 09_INFRASTRUCTURE_AGENTIQUE/prism -p 'test_incremental_math_library.py' -v

  one-shot-local-cpu-model:
    needs: prereg-and-offline-gates
    runs-on: ubuntu-latest
    timeout-minutes: 36
    env:
      SRC_URL: https://raw.githubusercontent.com/oscarlevin/discrete-book/1a2005c6797bec10289f09e706f81c6c4b809a52/source/sec_gt-relations.ptx
      SRC_BLOB: 75bebda318694bb4712d60380b0e183e77f1e757
      LLAMA_URL: https://github.com/ggml-org/llama.cpp/releases/download/b12633/llama-b12633-bin-ubuntu-x64.tar.gz
      MODEL_URL: https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/main/Qwen2.5-3B-Instruct-Q4_K_M.gguf
      MODEL_SHA: 9c9f56a391a3abbd5b89d0245bf6106081bcc3173119d4229235dd9d23253f94
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download only pinned source and verify git blob bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p real02_out "$RUNNER_TEMP/real02"
          curl -fLsS --retry 2 --retry-all-errors --max-time 240 "$SRC_URL" -o "$RUNNER_TEMP/real02/relations.ptx"
          test "$(git hash-object "$RUNNER_TEMP/real02/relations.ptx")" = "$SRC_BLOB"
          sha256sum "$RUNNER_TEMP/real02/relations.ptx" | tee real02_out/source.sha256
      - name: Download free local CPU engine and original 3B GGUF
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --retry-all-errors --max-time 300 "$LLAMA_URL" -o "$RUNNER_TEMP/real02/llama.tar.gz"
          tar -xzf "$RUNNER_TEMP/real02/llama.tar.gz" -C "$RUNNER_TEMP/real02"
          BIN="$(find "$RUNNER_TEMP/real02" -type f -name llama-server | head -1)"
          test -n "$BIN"
          chmod +x "$BIN"
          echo "LLAMA_SERVER=$BIN" >> "$GITHUB_ENV"
          curl -fLsS --retry 2 --retry-all-errors --max-time 750 "$MODEL_URL" -o "$RUNNER_TEMP/real02/model.gguf"
          test "$(head -c 4 "$RUNNER_TEMP/real02/model.gguf")" = 'GGUF'
          echo "$MODEL_SHA  $RUNNER_TEMP/real02/model.gguf" | sha256sum -c -
          sha256sum "$RUNNER_TEMP/real02/model.gguf" | tee real02_out/model.sha256
          "$BIN" --version > real02_out/llama-version.txt 2>&1 || true
      - name: Start one CPU-only model without keys or paid API
        shell: bash
        run: |
          set -euo pipefail
          LIB="$(dirname "$LLAMA_SERVER")"
          LD_LIBRARY_PATH="$LIB:${LD_LIBRARY_PATH:-}" "$LLAMA_SERVER" \
            -m "$RUNNER_TEMP/real02/model.gguf" \
            --host 127.0.0.1 --port 8080 -c 6144 -t 2 -ngl 0 \
            > real02_out/llama-server.log 2>&1 &
          for i in $(seq 1 100); do
            if curl -sf --max-time 3 http://127.0.0.1:8080/health >/dev/null; then
              echo LOCAL_CPU_MODEL_READY
              exit 0
            fi
            sleep 2
          done
          tail -n 50 real02_out/llama-server.log
          exit 1
      - name: Acquisition from unannotated pinned mathematical text
        shell: bash
        run: |
          set -euo pipefail
          timeout 650 python 09_INFRASTRUCTURE_AGENTIQUE/prism/omega_memory_real02.py \
            --phase acquire --source-file "$RUNNER_TEMP/real02/relations.ptx" \
            --output real02_out --server http://127.0.0.1:8080 \
            2>&1 | tee real02_out/acquire.log
      - name: Fresh-process memory evaluation or explicit guarded block
        shell: bash
        run: |
          set -euo pipefail
          timeout 650 python 09_INFRASTRUCTURE_AGENTIQUE/prism/omega_memory_real02.py \
            --phase memory --output real02_out --server http://127.0.0.1:8080 \
            2>&1 | tee real02_out/memory.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('real02_out/report.json').read_text())
          assert r['paid_api_calls']==0 and r['theorems_certified']==0
          assert r['model_weights_updated'] is False
          assert r['model_calls'] <= 14
          assert r['stage'] in ('BLOCKED_NO_SINGLE_CARD','BLOCKED_INVALID_JSON_OR_QUOTE',
                                'BLOCKED_BOUNDED_FIDELITY','EVALUATED')
          print('EXPERIMENT_ARCHIVED',r['stage'])
          PY
      - name: Archive inspectable inputs, source hashes, raw generations and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-memory-real02-one-shot
          path: |
            real02_out/*.json
            real02_out/*.jsonl
            real02_out/*.sha256
            real02_out/*.txt
            real02_out/*.log
          retention-days: 7
          if-no-files-found: warn
