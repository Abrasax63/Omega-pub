name: Omega reproducibility fingerprint pilot
on:
  pull_request:
    paths:
      - 'tools/repro_fingerprint.py'
      - 'tools/repro_history_pilot.py'
      - 'tools/repro_scientific_pilot.py'
      - 'tests/test_repro_fingerprint.py'
      - 'tests/test_repro_history_pilot.py'
      - 'tests/test_repro_scientific_pilot.py'
      - 'tests/repro_sympy_version_probe.py'
      - '.github/workflows/repro-fingerprint-pilot.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific pilot dependency
        run: python -m pip install 'sympy==1.13.3'
      - name: Run isolated fingerprint regression tests
        run: python -m unittest discover -s tests -p 'test_repro_fingerprint.py' -v
      - name: Run isolated history regression tests
        run: python -m unittest discover -s tests -p 'test_repro_history_pilot.py' -v

      - name: Run existing Omega scientific script pilot
        run: python -m unittest discover -s tests -p 'test_repro_scientific_pilot.py' -v

  dependency-version-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sympy-version: ['1.12', '1.13.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual dependency version
        run: python -m pip install "sympy==${{ matrix.sympy-version }}"
      - name: Execute Omega scientific calculation and print fingerprint
        run: python -m tests.repro_sympy_version_probe
