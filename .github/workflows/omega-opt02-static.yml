name: Omega OPT02 static protocol and exactness checks

on:
  push:
    branches:
      - experiment/omega-strong-baseline-optimization-2026-11-15
    paths:
      - '09_INFRASTRUCTURE_AGENTIQUE/auto_research/opt02_*.py'
      - '09_INFRASTRUCTURE_AGENTIQUE/auto_research/OPT02_PREREG.md'
      - '.github/workflows/omega-opt02-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-protocol-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned external graph source for independent tests
        run: python -m pip install --disable-pip-version-check 'networkx==3.5'
      - name: Parse programs and run deterministic negative controls
        working-directory: 09_INFRASTRUCTURE_AGENTIQUE/auto_research
        run: |
          python -m py_compile opt02_generator.py opt02_evaluator.py test_opt02.py
          python -m unittest -v test_opt02.py test_gate.py test_model_proposal.py
