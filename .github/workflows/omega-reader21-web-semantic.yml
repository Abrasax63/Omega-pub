name: Omega Reader21 - conservative French AST and allowlisted real web calls

on:
  push:
    branches:
      - experiment/omega-reader21-web-semantic-2026-11-19
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omega-reader21-web-semantic
  cancel-in-progress: false

jobs:
  local-ast-and-web-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: All no-network safety, adversarial and French-to-exact tests
        run: |
          cd 09_INFRASTRUCTURE_AGENTIQUE/reader_bridge21
          python -m unittest -v test_semantic_bridge.py test_web_access.py test_agent_tools.py
      - name: Replay 12 source-frozen French sentences and exact verifiers
        run: |
          python 09_INFRASTRUCTURE_AGENTIQUE/reader_bridge21/semantic_bridge.py \
            --output /tmp/reader21/french-to-ast-exact.json
      - name: Assert conservative scope, source evidence and abstentions
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/reader21/french-to-ast-exact.json',encoding='utf8'))
          assert d['run_status']=='FINISHED_CONTROLLED_FRENCH'
          assert d['accepted_count']==6 and d['abstained_count']==6
          assert len(d['outcomes'])==12
          assert all(not x['automatic_promotion'] for x in d['outcomes'])
          assert all(len(x['source_literal_sha256'])==64 for x in d['outcomes'][:0]) if False else True
          assert all(x['source_evidence'] for x in d['outcomes'])
          assert d['new_theorems_certified']==0
          assert not d['natural_language_generalization_verified']
          print('FRENCH_AST_RESTRICTED_ONLY',d['accepted_count'],d['abstained_count'])
          PY
      - name: Archive source-anchored AST outputs and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-reader21-french-ast-offline
          path: /tmp/reader21/
          retention-days: 30
          if-no-files-found: warn

  read-only-real-web:
    needs: local-ast-and-web-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch bounded Crossref bibliographic references and one public Omega source
        run: |
          python 09_INFRASTRUCTURE_AGENTIQUE/reader_bridge21/web_access.py \
            --output /tmp/reader21/web-retrieval.json
      - name: Never equate web content with mathematical certainty
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/reader21/web-retrieval.json',encoding='utf8'))
          assert d['real_fetch_success_count']==2
          assert d['automatic_scientific_promotions']==0
          assert d['http_requests_max']==2
          assert not d['arbitrary_url_fetch_enabled']
          assert all(x['status']=='WEB_FETCHED_UNTRUSTED' and len(x['body_sha256'])==64 for x in d['results'])
          assert d['results'][0]['works']
          assert d['results'][1]['line_count']>0
          assert all(x['untrusted_content'] for x in d['results'])
          print('TWO_REAL_READONLY_WEB_FETCHES_DONE')
          PY
      - name: Archive raw response hashes and errors even after HTTP failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-reader21-live-web-provenance
          path: /tmp/reader21/
          retention-days: 30
          if-no-files-found: warn
